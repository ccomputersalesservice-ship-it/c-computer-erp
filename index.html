<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>C COMPUTER ERP</title>
<style>
:root{--navy:#0a1a40;--navy2:#0f2658;--blue:#1f6feb;--blue2:#3b8cff;--bg:#eef2f9;--card:#fff;--ink:#14213d;--mut:#64748b;--line:#e3e9f3;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',Roboto,'Noto Sans Gujarati','Shruti',Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hide{display:none!important}
small.gu,.gu{font-size:.82em;opacity:.85}
.l2{display:block;font-size:.78em;opacity:.8;font-weight:400}
/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 20% 0%,#16347a 0,#0a1a40 60%);padding:18px}
.login .box{background:#fff;border-radius:20px;padding:26px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login img{display:block;width:230px;max-width:80%;margin:0 auto 12px}
.login h2{text-align:center;font-size:18px;margin-bottom:16px;color:var(--navy)}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:236px;background:linear-gradient(180deg,#0b1b45,#08142f);color:#cfdcff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;transition:transform .2s}
.side .brand{padding:16px 14px 10px}
.side .brand img{width:100%;display:block;border-radius:14px;background:#fff;padding:2px}
.side nav{flex:1;overflow:auto;padding:8px 10px}
.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#d6e2ff;text-decoration:none;cursor:pointer;margin-bottom:3px;font-weight:600}
.side a:hover{background:rgba(255,255,255,.08)}
.side a.on{background:linear-gradient(90deg,#1b64e6,#2f7cff);color:#fff;box-shadow:0 6px 16px rgba(31,111,235,.45)}
.side a svg{width:19px;height:19px;flex:none}
.side .ver{font-size:11px;opacity:.55;padding:10px 16px}
.main{flex:1;margin-left:236px;min-width:0;display:flex;flex-direction:column}
.top{height:62px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .burger{display:none}
.ibtn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--navy)}
.ibtn:hover{background:#eef3fc}.ibtn svg{width:21px;height:21px}
.badge{position:absolute;top:3px;right:2px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px;font-weight:700}
.sbox{flex:1;max-width:520px;position:relative;margin:0 auto 0 8px}
.sbox input{width:100%;height:40px;border-radius:22px;border:1px solid var(--line);background:#f6f8fc;padding:0 14px 0 38px;outline:0}
.sbox input:focus{border-color:var(--blue);background:#fff}
.sbox svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--mut)}
.drop{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,26,64,.18);max-height:60vh;overflow:auto;z-index:50}
.drop .g{padding:6px 12px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;background:#f6f8fc}
.drop .it{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line)}
.drop .it:hover{background:#eef4ff}.drop .it small{color:var(--mut)}
.lang{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 10px;cursor:pointer;font-weight:700;font-size:12px}
.lang button.on{background:var(--blue);color:#fff}
.me{display:flex;align-items:center;gap:9px;cursor:pointer;padding:3px 6px;border-radius:12px}
.me:hover{background:#eef3fc}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1f6feb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800}
.me b{display:block;font-size:13px;line-height:1.1}.me small{color:var(--mut)}
.page{padding:20px;flex:1}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:23px;color:var(--navy);flex:1;min-width:150px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(16,36,94,.07);padding:16px}
.card h3{font-size:15px;margin-bottom:10px;color:var(--navy)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.6fr 1fr}
/* kpi */
.kpi{border-radius:14px;color:#fff;padding:16px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 20px rgba(0,0,0,.14);min-height:92px}
.kpi .ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}.kpi .ic svg{width:26px;height:26px}
.kpi small{display:block;opacity:.92;font-size:12px}.kpi b{font-size:24px;line-height:1.2}
.k-blue{background:linear-gradient(135deg,#1f66e8,#3d93ff)}.k-green{background:linear-gradient(135deg,#0f9d58,#34c76f)}.k-purple{background:linear-gradient(135deg,#6d28d9,#9b5cf6)}.k-orange{background:linear-gradient(135deg,#f97316,#ffb020)}.k-red{background:linear-gradient(135deg,#dc2626,#f97362)}
.stat{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(16,36,94,.06);border-left:4px solid var(--blue)}
.stat small{color:var(--mut);display:block}.stat b{font-size:20px}
/* controls */
.btn{border:0;border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.55;cursor:wait}
.btn svg{width:17px;height:17px}
.btn.s{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.g{background:#e8eefb;color:var(--navy)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.o{background:#fff;border:1px solid var(--line);color:var(--navy)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld>label{font-weight:700;font-size:12px;color:#334155}
input,select,textarea{border:1px solid #cfd8e8;border-radius:10px;padding:9px 11px;background:#fff;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,235,.12)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:120px}.row>.fix{flex:none;min-width:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.tools input,.tools select{width:auto;min-width:150px;flex:1;max-width:260px}
/* tables */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{background:#f3f6fc;text-align:left;padding:10px 12px;font-size:12px;color:#475569;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f5f9ff}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.thumb{width:48px;height:42px;border-radius:8px;object-fit:cover;background:#eef2f9;display:block}
.ph0{width:48px;height:42px;border-radius:8px;background:#eef2f9;display:grid;place-items:center;color:#9aa8c2}.ph0 svg{width:22px;height:22px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;background:#e5e7eb;color:#374151;white-space:nowrap}
.p-ok{background:#d9f5e3;color:#0b7a3a}.p-warn{background:#fff0cf;color:#9a6200}.p-bad{background:#fde1e1;color:#b91c1c}.p-blue{background:#dbeafe;color:#1d4ed8}.p-pur{background:#ede4ff;color:#6d28d9}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pc2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}.pc2:hover{box-shadow:0 4px 16px rgba(30,60,120,.12)}
.pimg{height:140px;border-radius:10px;background:#f3f6fc;overflow:hidden;display:grid;place-items:center}.pimg>div{width:100%;height:100%;display:grid;place-items:center}
.pimg .thumb{width:100%;height:140px;border-radius:0;object-fit:contain;background:#f3f6fc}.pimg .ph0{width:64px;height:64px;background:none}.pimg .ph0 svg{width:36px;height:36px}
.pn{font-weight:700;font-size:13.5px;line-height:1.3;min-height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pr{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:24px}.pr b{color:var(--blue)}
@media (max-width:860px){.pgrid{grid-template-columns:repeat(2,1fr);gap:10px}.pimg,.pimg .thumb{height:110px}}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}
.empty{padding:30px;text-align:center;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,20,47,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.mod{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mod.w{max-width:980px}.mod.n{max-width:460px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.mh h3{flex:1;font-size:17px;color:var(--navy)}.mb{padding:18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#0b1b45;color:#fff;padding:11px 18px;border-radius:12px;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;font-weight:600}
.toast.bad{background:#b91c1c}.toast.ok{background:#0f7a3d}
.spin{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:250;display:grid;place-items:center}
.spin i{width:42px;height:42px;border:4px solid #cfe0ff;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef2f9,#f8faff,#eef2f9);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;height:90px}
@keyframes sk{to{background-position:-200% 0}}
/* charts */
.chart{width:100%}.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.donutw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.donutw ul{list-style:none;margin:0;padding:0;font-size:12.5px;flex:1;min-width:130px}.donutw li{margin:3px 0;display:flex;align-items:center;gap:7px}.donutw li i{width:10px;height:10px;border-radius:50%}
/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap}.photos .pt{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;background:#eef2f9;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}.photos .pt .x{position:absolute;right:3px;top:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:8px;font-size:11px;padding:2px 6px;cursor:pointer}
.addph{width:92px;height:92px;border-radius:12px;border:2px dashed #b9c7e4;display:grid;place-items:center;color:#6a7da6;cursor:pointer;background:#f7f9fe;font-size:12px;text-align:center}
.pcard{display:flex;gap:10px;align-items:center}
.tag{font-size:11px;background:#eef2f9;border-radius:6px;padding:2px 7px;color:#475569}
.scanbox{border:2px dashed #b9c7e4;border-radius:16px;padding:18px;text-align:center;background:#f7f9fe}
.scanbox svg{width:64px;height:64px;color:var(--blue)}
video.cam{width:100%;border-radius:12px;background:#000;max-height:50vh}
.steps li{margin:6px 0}
.mobonly{display:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border-radius:16px;padding:14px 6px;text-align:center;box-shadow:0 2px 10px rgba(16,36,94,.08);cursor:pointer;font-weight:700;font-size:13px;color:var(--navy)}
.tile svg{width:34px;height:34px;display:block;margin:0 auto 6px;color:var(--blue)}
.tile.big{padding:20px 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:0;background:#e8eefb;color:var(--navy);padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}.tabs button.on{background:var(--blue);color:#fff}
.note{background:#fff8e1;border:1px solid #ffe29a;color:#6b4b00;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.note.info{background:#eaf2ff;border-color:#c5dbff;color:#1d3f8a}
.bnav{display:none}
/* print */
#printRoot{display:none}
@media print{
  body *{visibility:hidden!important}
  #printRoot,#printRoot *{visibility:visible!important}
  #printRoot{display:block!important;position:absolute;left:0;top:0}
  html,body{background:#fff!important}
}
.lbl{page-break-after:always;break-after:page;overflow:hidden;background:#fff;color:#000;font-family:Arial,sans-serif;display:flex;flex-direction:column;justify-content:center}
.lbl svg{display:block}
.prevlbl{display:inline-block;border:1px dashed #94a3b8;margin:6px;background:#fff;vertical-align:top}
/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.5)}.side.open{transform:none}
  .main{margin-left:0}.top{height:56px;padding:0 10px;gap:6px;background:linear-gradient(90deg,#0a1a40,#10296a);border:0}
  .top .burger{display:grid;color:#fff}.top .ibtn{color:#fff}.top .ibtn:hover{background:rgba(255,255,255,.12)}
  .top .me small,.top .me b,.top .lang{display:none}
  .sbox{margin:0}.sbox input{background:rgba(255,255,255,.14);border-color:transparent;color:#fff;height:36px}.sbox input::placeholder{color:#c9d6f5}.sbox svg{color:#c9d6f5;top:9px}
  .page{padding:12px 12px 90px}.ph h1{font-size:19px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}.g2.stack{grid-template-columns:1fr}
  .kpi{padding:12px;min-height:80px;gap:9px}.kpi b{font-size:18px}.kpi .ic{width:38px;height:38px}
  .mobonly{display:block}.deskonly{display:none!important}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:40;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .bnav a{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:#64748b;gap:2px;font-weight:700;cursor:pointer;min-width:56px}.bnav a svg{width:22px;height:22px}.bnav a.on{color:var(--blue)}
  .bnav .plus{width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(31,111,235,.5);border:4px solid #fff}.bnav .plus svg{width:26px;height:26px}
  .toast{bottom:80px}
  /* tables become cards */
  .tbl.rc thead{display:none}.tbl.rc,.tbl.rc tbody,.tbl.rc tr,.tbl.rc td{display:block;width:100%}
  .tbl.rc tr{border-top:8px solid var(--bg);padding:8px 4px;position:relative}.tbl.rc tr:first-child{border-top:0}
  .tbl.rc td{border:0;padding:3px 10px;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .tbl.rc td::before{content:attr(data-l);font-weight:700;color:var(--mut);font-size:11.5px;text-align:left;flex:none}
  .tbl.rc td.nl::before{display:none}.tbl.rc td.nl{justify-content:flex-start;text-align:left}
  .mod{border-radius:14px}.ov{padding:2vh 6px}
  .tiles{gap:10px}
}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}.top .lang{display:none}}

/* ===== Look: clean white product-admin style (orange accent) ===== */
:root{--navy:#1c1c1e;--navy2:#2a2a2d;--blue:#e2603f;--blue2:#ef7a5b;--bg:#f4f4f2;--ink:#1c1c1e;--mut:#6f7378;--line:#e6e6e3;--r:14px}
html,body{font-family:'Inter','Segoe UI',Roboto,'Noto Sans Gujarati',Arial,sans-serif;background:#f4f4f2}
.login{background:#f4f4f2}.login .box{box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid var(--line)}
.side{background:#fff;color:#55595e;border-right:1px solid var(--line)}
.side .brand img{background:transparent}
.side a{color:#55595e;font-weight:600}.side a:hover{background:#f4f4f2}
.side a.on{background:#fdece7;color:#e2603f;box-shadow:none}
.side .ver{color:#9a9da1;opacity:1}
.top{background:#fff;border-bottom:1px solid var(--line)}
.sbox input{background:#fff;border-radius:10px}.sbox input:focus{border-color:#e2603f}
.ibtn:hover,.me:hover{background:#f4f4f2}
.lang button.on{background:#1c1c1e}
.av{background:#e2603f}
.card{box-shadow:none;border:1px solid var(--line);background:#fff}
.stat{box-shadow:none;border:1px solid var(--line);border-left:4px solid #e2603f}
.kpi{background:#fff!important;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.kpi .ic{background:#fdece7;color:#e2603f}.kpi small{color:var(--mut);opacity:1}
.k-green .ic{background:#e3f5ea;color:#16a34a}.k-purple .ic{background:#efe8fd;color:#7c3aed}.k-orange .ic{background:#fff0dc;color:#f59e0b}.k-red .ic{background:#fde4e4;color:#dc2626}
.btn{background:#1c1c1e;color:#fff;border-radius:10px}.btn:hover{filter:none;background:#38383b}
.btn.g{background:#f0f0ee;color:#1c1c1e}.btn.o{background:#fff}
.btn.ok{background:#16a34a}.btn.bad{background:#ef4444}
input:focus,select:focus,textarea:focus{border-color:#e2603f;box-shadow:0 0 0 3px rgba(226,96,63,.14)}
input,select,textarea{border-color:#dcdcd8}
.tabs button{background:#fff;border:1px solid var(--line);color:#55595e}.tabs button.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.tbl th{background:#faf9f7}.tbl tr.click:hover td{background:#faf9f7}
.tw{border-color:var(--line)}
.pc2{border-radius:14px}.pc2:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);border-color:#d9d9d5}
.pimg,.pimg .thumb{background:#f6f6f4}
.pr b{color:#1c1c1e}
.tile{box-shadow:none;border:1px solid var(--line)}.tile svg{color:#e2603f}
.scanbox svg{color:#e2603f}.scanbox{background:#faf9f7;border-color:#d9d9d5}
.mh h3,.ph h1,.card h3{color:#1c1c1e}
.note.info{background:#f4f4f2;border-color:var(--line);color:#3b3e42}
.addph{background:#faf9f7;border-color:#d9d9d5;color:#8a8d91}
.spin i{border-color:#f5d6cc;border-top-color:#e2603f}
.toast{background:#1c1c1e}
.skel{background:linear-gradient(90deg,#efeeeb,#f8f7f5,#efeeeb);background-size:200% 100%}
.ph{padding-bottom:2px}
.ph h1{font-weight:700}
.pill.p-blue{background:#fdece7;color:#c2410c}
/* ---------- new login (split card) ---------- */
.lgw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#a3abb9}
.lgc{width:100%;max-width:980px;border-radius:34px;background:linear-gradient(160deg,#e9ebee 0%,#eceae0 45%,#f8e9a4 100%);display:grid;grid-template-columns:1fr 1.15fr;gap:0;padding:14px;box-shadow:0 30px 70px rgba(30,40,60,.35)}
.lgl{padding:20px 34px 18px;display:flex;flex-direction:column;min-height:560px}
.lgl .logo{display:inline-flex;align-self:flex-start;border:1px solid #9aa0a8;border-radius:999px;padding:4px 14px;background:rgba(255,255,255,.4)}
.lgl .logo img{height:30px;width:auto;display:block;margin:0}
.lgf{margin:auto 0;width:100%}
.lgf h2{font-size:26px;font-weight:500;text-align:center;margin:0 0 4px;color:#1c1c1e}
.lgf .sub{text-align:center;font-size:12.5px;color:#4b4f55;margin:0 0 20px}
.lgf .fld{margin-bottom:12px}.lgf .fld>label{font-size:11px;font-weight:500;color:#5b6068;margin-left:6px}
.lgf input{background:#fbfaf6;border:0;border-radius:999px;padding:13px 16px;font-size:14px}
.lgf .go{width:100%;margin-top:10px;background:#ffd84d;color:#1c1c1e;border:0;border-radius:999px;padding:14px;font-size:15px;font-weight:500;cursor:pointer}
.lgf .go:hover{background:#ffcf24}
.lgf .go:disabled{opacity:.6}
.lgf .lang{display:flex;justify-content:center;margin-top:14px}
.lgfoot{font-size:11.5px;color:#4b4f55;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lgr{position:relative;border-radius:28px;overflow:hidden;min-height:560px;background:#222 center/cover no-repeat}
.lgr:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.55))}
.lgr>*{position:absolute;z-index:2}
.lgclock{bottom:112px;left:16px;background:#ffd84d;border-radius:16px;padding:10px 14px;min-width:170px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.lgclock b{display:block;font-size:22px;font-weight:600;color:#1c1c1e;line-height:1.1}
.lgclock small{font-size:11.5px;color:#3a3a3a}
.lgname{top:16px;right:16px;background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;color:#1c1c1e}
.lgcal{left:16px;right:16px;bottom:16px;background:rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:12px 10px 10px;color:#fff}
.lgcal .mo{font-size:12px;font-weight:600;margin:0 6px 8px;display:flex;justify-content:space-between}
.lgcal .wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.lgcal .wk div{font-size:11px;padding:4px 0;border-radius:12px}
.lgcal .wk div b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.lgcal .wk div.t{background:#ffd84d;color:#1c1c1e}
@media (max-width:820px){.lgc{grid-template-columns:1fr;border-radius:26px}.lgl{padding:14px 14px 10px;min-height:0}.lgf{margin:22px 0}.lgr{min-height:340px;order:-1}.lgfoot{margin-top:6px}}

/* ---------- Dream Life login + greeting splash ---------- */
.dl{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:flex-end;padding:24px 4vw;overflow:hidden;background:#0b2a5b}
.dl .bgb,.dl .bgp{position:absolute;inset:0;background:center/cover no-repeat}
.dl .bgb{filter:blur(28px) brightness(.9);transform:scale(1.15)}
.dl .bgp{background-size:cover;background-position:center center}
.dl .card{position:relative;z-index:3;width:100%;max-width:380px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:28px;padding:26px 28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dl .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:14px;color:#1c1c1e;margin-bottom:22px}
.dl .brand img{height:38px;width:auto}
.dl .gm{font-size:12px;font-weight:600;letter-spacing:.12em;color:#5b6068;text-transform:uppercase}
.dl h2{font-size:30px;font-weight:800;margin:2px 0 4px;color:#111}
.dl .sub{font-size:12.5px;color:#5b6068;margin:0 0 16px}
.dl .fld{margin-bottom:12px}.dl .fld>label{font-size:11.5px;color:#4b4f55;margin-left:2px}
.dl input{background:#e8efff;border:0;border-radius:12px;padding:13px 14px;font-size:15px;width:100%}
.dl .go{width:100%;margin-top:10px;background:#111;color:#fff;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:700;cursor:pointer}
.dl .go:disabled{opacity:.6}
.dl .lang{display:flex;justify-content:center;margin-top:12px}
.dl .ft{text-align:center;font-size:11.5px;color:#5b6068;margin-top:14px}
.dl .qt{position:absolute;z-index:3;right:4vw;bottom:60px;width:380px;max-width:92vw;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:14px 18px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.dl .qt q{display:block;font-size:17px;font-weight:600;quotes:none}
.dl .qt b{display:block;margin-top:8px;font-size:14px}.dl .qt small{font-size:11.5px;opacity:.9}
@media (max-width:820px){.dl{justify-content:center;align-items:flex-end;padding:16px}.dl .bgp{background-size:contain;background-position:center top}.dl .qt{display:none}.dl .card{margin-bottom:6px}}
.splash{position:fixed;inset:0;z-index:400;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
.splash.out{opacity:0}
.splash img{height:84px;width:auto}
.splash h1{font-size:30px;font-weight:800;color:#111;margin:0;text-align:center;padding:0 16px}
.splash .bars{display:flex;gap:6px;align-items:flex-end;height:30px}
.splash .bars i{width:7px;height:10px;border-radius:4px;background:#e2603f;animation:sbar 1s ease-in-out infinite}
.splash .bars i:nth-child(2){animation-delay:.15s;background:#2f6bff}.splash .bars i:nth-child(3){animation-delay:.3s;background:#22b573}
@keyframes sbar{0%,100%{height:10px}50%{height:30px}}

/* ---------- Cash Book (CRM look) ---------- */
.cbg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:12px 0}
.cbg3{grid-template-columns:2fr 1.4fr 1.4fr}
.cbc{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(16,36,94,.07);min-width:0}
.cbc small{display:block;color:#6b7280;font-size:12px}.cbc b{display:block;font-size:24px;margin-top:4px}
.cba,.cbt{cursor:pointer}.cba.on{outline:2px solid #2f6bff}
.cbt{background:#2f6bff}.cbt small,.cbt b{color:#fff}.cbt.on{background:#2f6bff}.cbt:not(.on){background:#fff}.cbt:not(.on) small{color:#6b7280}.cbt:not(.on) b{color:#111}
.cbrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cbhead{margin-top:6px}
.cbrow>span{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}.cbrow input[type=date],.cbrow input[type=month]{width:160px;max-width:100%}
.cbf{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.cbf>*{flex:1 1 130px;min-width:0}.cbf>.btn{flex:0 0 auto;background:#2f6bff;color:#fff;padding:12px 22px}
.card.cbf{margin:12px 0}
.cbpills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pillb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.pillb.on{background:#2f6bff;color:#fff;border-color:#2f6bff}
.cbsum{margin:12px 0;background:#eef3ff}
.cbflt{display:flex;gap:8px;flex-wrap:wrap}.cbflt>*{width:auto!important;flex:0 1 170px;min-width:110px}.cbflt>input{flex-basis:220px}
@media (max-width:820px){.cbg3{grid-template-columns:1fr}.cbc b{font-size:20px}}
</style>

    paths += items.length === 1 ? `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${PAL[i % 9]}" stroke-width="${R - r}"/>` : `<path d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z" fill="${PAL[i % 9]}"><title>${esc(it.name)}: ${nf(it.value)}</title></path>`;
    a0 = a1 + 0.0001;
  });
  return `<div class="donutw"><svg viewBox="0 0 180 180" width="170" height="170">${paths}<text x="90" y="88" text-anchor="middle" font-size="19" font-weight="800" fill="#14213d">${esc(centerTop)}</text><text x="90" y="106" text-anchor="middle" font-size="11" fill="#64748b">${esc(centerSub)}</text></svg><ul>${items.map((it, i) => `<li><i style="background:${PAL[i % 9]}"></i>${esc(it.name)} (${Math.round(it.value * 100 / tot)}%)</li>`).join('')}</ul></div>`;
}
</script>

<script>

/* ---------- Dashboard ---------- */

async function V_dash() {

    kpi('k-purple', 'products', 'totproducts', nf(c.products)) + kpi(a ? 'k-orange' : 'k-red', a ? 'stock' : 'bell', a ? 'totstock' : 'lowstock', nf(a ? c.stockUnits : c.low)) + '</div>';
  if (a) h += `<div class="card" style="margin:14px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div class="ic" style="font-size:26px">₹</div><div style="flex:1;min-width:180px"><small>Stock Value (at cost price)</small><div style="font-size:28px;font-weight:800;display:flex;align-items:center;gap:12px"><span id="sval" data-v="${esc(inr(c.stockValue))}">₹ ••••••</span><button class="btn" style="padding:5px 12px;font-size:12px" data-act="svshow">Show</button></div></div><div><small>${nf(c.stockUnits)} units in ${nf(c.products)} products</small>${c.noCost ? `<br><small style="color:#b45309">${nf(c.noCost)} products have no cost price yet (not counted)</small>` : ''}</div></div>`;

  if (a) stats.push(['Serialised Items', c.serialised, '#06b6d4'], ['Quantity-based Items', c.qtyBased, '#84cc16']);

  h += `<div class="mobonly" style="margin:14px 0"><div class="grid g2">${stats.slice(0, 6).map(s => stat(s[0], nf(s[1]), s[2])).join('')}</div></div>`;
  h += '<div class="grid g2 stack">' + (a ? `<div class="card"><h3>${LI('salestrend')}</h3>${barChart(d.trend, [{ k: 'sales', n: 'Sales', c: '#1f6feb' }, { k: 'purchase', n: 'Purchase', c: '#7c3aed' }])}</div>` : `<div class="card"><h3>${LI('movement')}</h3>${barChart(d.movement, [{ k: 'in', n: 'In', c: '#16a34a' }, { k: 'out', n: 'Out', c: '#ef4444' }])}</div>`) +
    `<div class="card"><h3>${LI('stockcat')}</h3>${d.categories.length ? donut(d.categories, nf(c.stockUnits), 'Units') : '<div class="empty">No stock yet</div>'}</div></div>`;
  if (a) h += `<div class="card" style="margin-top:14px"><h3>${LI('movement')}</h3>${barChart(d.movement, [{ k: 'in', n: 'Stock In', c: '#16a34a' }, { k: 'out', n: 'Stock Out', c: '#ef4444' }], { w: 1160, h: 200 })}</div>`;
  h += '<div class="grid g2 stack" style="margin-top:14px">' +
    `<div class="card"><h3>${LI('lowalert')}</h3>${tbl([{ h: '#', k: (r, i) => i + 1, l: '#' }, { h: LT('products'), k: r => esc(r.name), l: LT('products'), nl: true }, { h: 'Current', k: r => nf(r.current), cls: 'r', l: 'Current' }, { h: 'Reorder', k: r => nf(r.reorder), cls: 'r', l: 'Reorder' }, { h: '', k: () => `<button class="btn bad s" data-act="go" data-r="reports" data-tab="reorder">Reorder</button>`, cls: 'r' }], d.lowStock, { empty: 'No low stock products 👍' })}</div>` +
    `<div class="card"><h3>${LI('recentorders')}</h3>${tbl([{ h: 'Order ID', k: r => esc(r.orderId), l: 'Order' }, { h: LT('customers'), k: r => esc(r.customer), l: LT('customers') }].concat(a ? [{ h: LT('total'), k: r => inr(r.total), cls: 'r', l: LT('total') }] : []).concat([{ h: LT('status'), k: r => pill(r.status), l: LT('status') }]), d.recentOrders, { click: 'openorder', id: r => r.orderId, empty: 'No orders yet' })}</div></div>`;
  h += '<div class="grid g2 stack" style="margin-top:14px">' + (a ? `<div class="card"><h3>${LI('recentpur')}</h3>${tbl([{ h: 'ID', k: r => esc(r.purchaseId), l: 'ID' }, { h: LT('vendor'), k: r => esc(r.vendor), l: LT('vendor') }, { h: LT('total'), k: r => inr(r.amount), cls: 'r', l: LT('total') }, { h: LT('status'), k: r => pill(r.status), l: LT('status') }], d.recentPurchases, { click: 'openpur', id: r => r.purchaseId, empty: 'No purchases yet' })}</div>` : '') +
    `<div class="card"><h3>${LI('recentact')}</h3>${tbl([{ h: LT('date'), k: r => esc(r.dt.slice(5, 16)), l: LT('date') }, { h: LT('products'), k: r => esc(r.product) + (r.serial ? '<br><small>' + esc(r.serial) + '</small>' : ''), l: LT('products') }, { h: 'Type', k: r => `<span class="tag">${esc(r.type)}</span>`, l: 'Type' }, { h: LT('qty'), k: r => nf(r.qty), cls: 'r', l: LT('qty') }], d.recentActivity, { empty: 'No activity yet' })}</div></div>`;
  $('#page').innerHTML = `<div class="ph"><h1>${LI('dash')}</h1><select id="per" class="fix" style="max-width:170px">${[['month', 'thismonth'], ['lastmonth', 'lastmonth'], ['year', 'thisyear'], ['all', 'alltime']].map(p => `<option value="${p[0]}" ${p[0] === d.period ? 'selected' : ''}>${LT(p[1])}</option>`).join('')}</select></div>` + h;
  $('#per').onchange = e => { S.params.period = e.target.value; V_dash(); };

/* ---------- Dashboard extras: today, target, alerts, best sellers, quick actions ---------- */
function dashExtra(d, a) {
  let h = '';
  const chg = p => `<span style="font-size:12px;font-weight:700;color:${p >= 0 ? '#16a34a' : '#dc2626'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
  if (a && d.today) {
    const t = d.today, tk = (k, lab, col) => `<div class="card" style="border-top:3px solid ${col}"><small>${lab}</small><div style="font-size:24px;font-weight:800;margin:4px 0">${inr(t.today[k])}</div><small>Yesterday ${inr(t.yesterday[k])} · ${chg(t.growth[k])}</small></div>`;
    h += `<h3 style="margin:16px 0 8px">Today's Business</h3><div class="grid g3 stack">${tk('sales', "Today's Sales", '#1f6feb')}${tk('profit', "Today's Profit", '#16a34a')}${tk('purchase', "Today's Purchase", '#7c3aed')}</div>`;
  }
  if (a && d.target) {
    const g = d.target;
    h += `<div class="card" style="margin:14px 0"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Monthly Sales Target</h3><b>${inr(g.achieved)} / ${inr(g.target)} · ${g.pct}%</b></div>
      <div style="height:14px;background:#eceae6;border-radius:99px;margin:10px 0;overflow:hidden"><div style="height:100%;width:${g.pct}%;background:${g.pct >= 100 ? '#16a34a' : '#1f6feb'};border-radius:99px;transition:width .8s"></div></div>
      <div class="grid g4 stack"><div><small>Remaining</small><br><b>${inr(g.remaining)}</b></div><div><small>Need per day (${g.daysLeft} days left)</small><br><b>${inr(g.perDay)}</b></div><div><small>Achieved</small><br><b>${inr(g.achieved)}</b></div><div><small>Month profit</small><br><b style="color:#16a34a">${inr(g.profit)}</b></div></div></div>`;
  }
  if (d.followups && d.followups.rows.length) h += `<div class="card" style="margin:14px 0"><h3>Quotation follow-ups due (${d.followups.count})</h3>${tbl([{ h: 'Quotation', k: r => `<b>${esc(r.id)}</b>`, l: 'No' }, { h: 'Customer', k: r => esc(r.name) + (r.mobile ? '<br><small>' + esc(r.mobile) + '</small>' : ''), l: 'Customer' }, { h: 'Amount', k: r => inr(r.total), cls: 'r', l: 'Amount' }, { h: 'Due', k: r => esc(r.followDate), l: 'Due' }, { h: 'Staff', k: r => esc(r.by), l: 'Staff' }, { h: 'Note', k: r => esc(r.followNote), l: 'Note' }], d.followups.rows, { click: 'qopen', id: r => r.id })}</div>`;
  const al = d.alerts;
  if (al) {
    const chip = (k, lab, col) => `<div class="stat" data-act="dashal" data-k="${k}" style="cursor:pointer;border-color:${col}"><small>${lab}</small><b>${nf(al.counts[k])}</b></div>`;
    h += `<h3 style="margin:16px 0 8px">Stock Alerts <small style="font-weight:400">(tap to see list)</small></h3><div class="grid g4 stack">${chip('out', 'Out of Stock', '#ef4444')}${chip('low', 'Low / Reorder', '#f59e0b')}${chip('dead', 'Dead Stock (90d)', '#64748b')}${chip('slow', 'Slow Moving (30-90d)', '#06b6d4')}${a ? chip('noCost', 'No Purchase Price', '#7c3aed') : ''}</div>`;
  }
  if (d.best) {
    const lst = (title, rows, showProfit) => `<div class="card"><h3>${title}</h3>${rows && rows.length ? rows.map(r => `<div style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eee"><div style="width:44px;height:44px;flex:none;border-radius:8px;overflow:hidden">${thumbBox(r.productId)}</div><div style="flex:1;min-width:0"><b style="font-size:13px">${esc(r.name)}</b><br><small>${esc([r.brand, r.model].filter(Boolean).join(' · '))}</small></div><div style="text-align:right"><b>${nf(r.qty)}</b><small> qty</small>${showProfit && r.profit !== undefined ? `<br><small style="color:#16a34a">${inr(r.profit)}</small>` : ''}</div></div>`).join('') : '<div class="empty">No sales yet in this period</div>'}</div>`;
    h += `<h3 style="margin:16px 0 8px">Best Selling</h3><div class="grid g2 stack">${lst('Top 10 Best Selling', d.best.top, a)}${a ? lst('Highest Profit Products', d.best.profit, true) : ''}</div>${a ? `<div style="margin-top:14px">${lst('Most Purchased', d.best.purchased, false)}</div>` : ''}`;
  }
  const qa = [['Add Product', 'products', 'newprod'], ['New Purchase', 'purchase', 'new'], ['New Sale', 'sales', 'new'], ['Build PC', 'build'], ['New Customer', 'customers'], ['Service Entry', 'crm'], ['Stock Audit', 'audit'], ['Print Barcode', 'print']];
  h += `<h3 style="margin:16px 0 8px">Quick Actions</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${qa.map(x => x[2] === 'newprod' ? `<button class="btn g" data-act="newprod">${x[0]}</button>` : `<button class="btn g" data-act="go" data-r="${x[1]}" ${x[2] === 'new' ? 'data-new="1"' : ''}>${x[0]}</button>`).join('')}</div>`;
  if (d.recentAct2 && d.recentAct2.length) h += `<div class="card" style="margin-top:14px"><h3>Latest Activity</h3>${tbl([{ h: 'Date & time', k: r => esc(dtm('', r.dt)), l: 'When' }, { h: 'Staff', k: r => `<b>${esc(r.who)}</b>`, l: 'Staff' }, { h: 'What', k: r => esc(r.action) + (r.id ? ' <small>' + esc(r.id) + '</small>' : ''), l: 'What' }], d.recentAct2, { empty: 'Nothing yet' })}</div>`;
  setTimeout(() => loadThumbs($$('[data-th]').map(e => e.dataset.th)), 60);
  return h;
}
ACT.dashal = d => {
  const rows = (S.dash && S.dash.alerts.lists[d.k]) || [], ttl = { out: 'Out of Stock', low: 'Low Stock / Reorder Required', dead: 'Dead Stock (no sale in 90 days)', slow: 'Slow Moving (no sale in 30-90 days)', noCost: 'Products Without Purchase Price' }[d.k];
  const m = modal(ttl, tbl([{ h: '', k: r => thumbBox(r.productId), nl: true }, { h: 'Product', k: r => `<b>${esc(r.name)}</b><br><small>${esc([r.brand, r.model, r.category].filter(Boolean).join(' · '))}</small>`, nl: true }, { h: 'Stock', k: r => nf(r.available), cls: 'r', l: 'Stock' }].concat(d.k === 'low' ? [{ h: 'Reorder', k: r => nf(r.reorder), cls: 'r', l: 'Reorder' }] : []), rows, { click: 'openprod', id: r => r.productId, empty: 'All good - nothing here' }), { cls: 'n' });
  loadThumbs(rows.map(r => r.productId), m.el);
};

/* ---------- Products ---------- */
const pf = { q: '', category: '', status: 'all', low: false, page: 1, size: 24 };
async function V_products() {
  const canAdd = isAdmin() || S.boot.staffAddProduct;
  page(LI('products'), (canAdd ? `<button class="btn" data-act="newprod">${ico('plus')} ${LT('newproduct')}</button>` : ''), `
    <div class="tools"><input id="pq" placeholder="${LT('search')}" value="${esc(pf.q)}"><select id="pc">${catOpts(pf.category, true)}</select>
    <select id="ps"><option value="all" ${pf.status === 'all' ? 'selected' : ''}>${LT('all')}</option><option value="active" ${pf.status === 'active' ? 'selected' : ''}>${LT('active')}</option><option value="inactive" ${pf.status === 'inactive' ? 'selected' : ''}>${LT('inactive')}</option></select>
    <label style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" id="pl" style="width:auto" ${pf.low ? 'checked' : ''}> ${LT('lowstock')}</label>
    <button class="btn g" data-act="scanhome">${ico('scan')}</button></div><div id="plist">${skel()}</div>`);
  const re = debounce(() => { pf.q = $('#pq').value; pf.category = $('#pc').value; pf.status = $('#ps').value; pf.low = $('#pl').checked; pf.page = 1; loadProducts(); }, 250);
  ['#pq', '#pc', '#ps', '#pl'].forEach(s => { $(s).oninput = re; $(s).onchange = re; });

async function loadProducts() {
  const r = await api('prod.list', pf);
  S.plist = r.rows;
  $('#plist').innerHTML = (r.rows.length ? `<div class="pgrid">${r.rows.map(x => {
    const low = x.ReorderLevel > 0 && x.stock.available <= x.ReorderLevel, sp = +x.SellPrice;
    return `<div class="pc2" data-act="openprod" data-id="${esc(x.ProductID)}"><div class="pimg">${thumbBox(x.ProductID)}</div>
      <div class="pn">${esc(x.Name)}</div><div class="pm"><small>${esc(x.Category)}${x.Active === 'YES' ? '' : ' · ' + LT('inactive')}</small></div>
      <div class="pr"><b>${sp > 0 ? '₹' + nf(sp) : ''}</b><span class="pill ${low || x.stock.available <= 0 ? 'p-bad' : 'p-ok'}">${nf(x.stock.available)} ${LT('stock')}</span></div></div>`; }).join('')}</div>` : '<div class="note info">No products</div>') + pager(r, 'ppage');
  loadThumbs(r.rows.map(x => x.ProductID), $('#plist'));
}
ACT.ppage = d => { pf.page = +d.p; loadProducts(); };
ACT.newprod = () => openProduct(null);
ACT.openprod = d => openProduct(d.id);

async function openProduct(id, prefill) {
  const p = id ? await api('prod.get', { id }, { loader: true }) : Object.assign({ TrackingType: 'QTY', Active: 'YES', ReorderLevel: 0, SellPrice: 0, Category: S.boot.categories[0] }, prefill || {});
  const edit = isAdmin() || (!id && S.boot.staffAddProduct), ro = edit ? '' : 'disabled';
  const hasStock = id && (p.stock.physical + p.stock.sold + p.stock.returned + p.stock.damaged > 0);
  const m = modal(id ? esc(p.Name) : LT('newproduct'), `
    <div class="row"><div class="fld"><label>${LT('name')} *</label><input id="f_name" value="${esc(p.Name || '')}" ${ro}></div>
    <div class="fld"><label>${LT('category')} *</label><select id="f_cat" ${ro}>${catOpts(p.Category)}</select></div></div>
    <div class="row"><div class="fld"><label>${LT('brand')}</label><input id="f_brand" value="${esc(p.Brand || '')}" ${ro}></div><div class="fld"><label>${LT('model')}</label><input id="f_model" value="${esc(p.Model || '')}" ${ro}></div></div>
    <div class="row"><div class="fld"><label>${LT('sku')}</label><input id="f_sku" value="${esc(p.SKU || '')}" ${ro}></div><div class="fld"><label>${LT('barcode')} (blank = auto)</label><input id="f_bc" value="${esc(p.Barcode || '')}" ${ro}></div></div>
    <div class="row"><div class="fld"><label>${LT('tracking')}</label><select id="f_tr" ${ro || (hasStock ? 'disabled' : '')}><option value="SERIAL" ${p.TrackingType === 'SERIAL' ? 'selected' : ''}>Manufacturer serial number (Laptop, Monitor, Printer...)</option><option value="ITEMID" ${p.TrackingType === 'ITEMID' ? 'selected' : ''}>Internal Item ID for every piece (RAM, SSD...)</option><option value="QTY" ${p.TrackingType === 'QTY' ? 'selected' : ''}>Quantity only (Mouse, Cable...)</option></select></div>
    <div class="fld"><label>${LT('reorder')}</label><input id="f_rl" type="number" min="0" value="${p.ReorderLevel}" ${ro}></div>
    ${isAdmin() ? `<div class="fld"><label>Selling price (default) ₹</label><input id="f_sp" type="number" min="0" value="${p.SellPrice}" ${ro}></div><div class="fld"><label>Cost price ₹ (only you see this)</label><input id="f_cp" type="number" min="0" step="0.01" value="${p.CostPrice || 0}" ${ro}></div>` : ''}</div>
    <div class="fld"><label>${LT('desc')}</label><textarea id="f_desc" ${ro}>${esc(p.Description || '')}</textarea></div>
    ${id ? `<div class="fld"><label>${LT('status')}</label><select id="f_act" ${ro}><option value="YES" ${p.Active === 'YES' ? 'selected' : ''}>${LT('active')}</option><option value="NO" ${p.Active !== 'YES' ? 'selected' : ''}>${LT('inactive')}</option></select></div>
    <div class="fld"><label>${LT('photo')} (max 6)</label><div id="phbox"></div></div>
    <div class="note info">Stock: <b>${p.stock.available}</b> ${LT('available')} · ${p.stock.reserved} ${LT('reserved')} · ${p.stock.physical} ${LT('physical')} · ${p.stock.damaged} ${LT('damaged')}</div>` : '<div class="note info">Save the product first, then add photos.</div>'}`,
    { cls: 'w', foot: `${id ? `<button class="btn g" id="fPrint">${ico('print')} ${LT('printsticker')}</button>` : ''}<button class="btn g" data-x>${LT('close')}</button>${edit ? `<button class="btn" id="fSave">${LT('save')}</button>` : ''}` });
  if (id) photoWidget(m.$('#phbox'), id, p.photos);
  if (id) m.$('#fPrint').onclick = () => { m.close(); go('print', { productIds: [id] }); };
  if (edit) { const _rid = rid(); m.$('#fSave').onclick = e => work(e.currentTarget, async () => {
    const body = { id: id || undefined, name: m.$('#f_name').value, category: m.$('#f_cat').value, brand: m.$('#f_brand').value, model: m.$('#f_model').value, sku: m.$('#f_sku').value, barcode: m.$('#f_bc').value, trackingType: m.$('#f_tr').value, reorderLevel: m.$('#f_rl').value, sellPrice: m.$('#f_sp') ? m.$('#f_sp').value : 0, costPrice: m.$('#f_cp') ? m.$('#f_cp').value : undefined, description: m.$('#f_desc').value, active: id ? m.$('#f_act').value === 'YES' : true };
    const r = await api('prod.save', body, { rid: _rid });

}

/* ---------- photos ---------- */
function photoWidget(host, pid, photos) {
  S.phTh = S.phTh || {};
  let cur = photos.slice(), pending = 0;
  const draw = async () => {
    const tiles = cur.map(f => `<div class="pt" data-ph="${f.id}"><div data-photo="${f.id}" style="width:100%;height:100%">${S.phTh[f.id] ? `<img src="${S.phTh[f.id]}" alt="">` : ''}</div>${isAdmin() ? `<button class="x" data-del="${f.id}">✕</button>` : ''}</div>`).join('');
    const busy = pending ? `<div class="pt" style="opacity:.55;display:grid;place-items:center"><small>Uploading ${pending}...</small></div>` : '';
    host.innerHTML = `<div class="photos">${tiles}${busy}${cur.length + pending < 6 ? `<div class="addph" data-add="cam">${ico('camera')}<br>Camera</div><div class="addph" data-add="gal">${ico('img')}<br>Gallery</div>` : ''}</div><div class="note info" style="margin-top:8px">Tap a photo to see it big or replace it.</div>`;
    const miss = cur.filter(f => !S.phTh[f.id]).map(f => f.id);
    if (miss.length) { try { const m = await api('photo.thumbs', { photoIds: miss }); miss.forEach(id => { if (m[id]) { S.phTh[id] = m[id]; const el = $(`[data-photo="${id}"]`, host); if (el) el.innerHTML = `<img src="${m[id]}" alt="">`; } }); } catch (e) { } }
  };
  const refresh = async () => { const p = await api('prod.get', { id: pid }); S.thumbs[pid] = undefined; cur = p.photos; draw(); };
  const bg = async f => {
    pending++; draw();
    try {
      const full = await shrinkImage(f, 900, 0.7), thumb = await shrinkImage(f, 150, 0.6);
      const r = await api('photo.upload', { productId: pid, dataUrl: full, thumbUrl: thumb }, { rid: rid() });
      if (r.duplicate) toast('This photo is already saved', 'ok');
      else { cur.push({ id: r.photoId }); S.phTh[r.photoId] = thumb; toast('Photo saved', 'ok'); }
      S.thumbs[pid] = undefined;
    } catch (e) { toast(e.message || 'Photo upload failed', 'bad'); }
    pending--; draw();
  };
  draw();
  host.onclick = async e => {
    const add = e.target.closest('[data-add]'), del = e.target.closest('[data-del]'), ph = e.target.closest('[data-ph]');
    if (add) { const f = await pickFile(add.dataset.add === 'cam'); if (f) bg(f); }
    else if (del) { if (await confirmBox('Delete this photo?')) await work(null, async () => { await api('photo.delete', { photoId: del.dataset.del }, { rid: rid() }); cur = cur.filter(x => x.id !== del.dataset.del); S.thumbs[pid] = undefined; draw(); }); }
    else if (ph) viewPhoto(pid, ph.dataset.ph, () => { S.phTh[ph.dataset.ph] = undefined; refresh(); });
  };
}
async function uploadPhoto(pid, file, replaceId) {
  const full = await shrinkImage(file, 900, 0.7), thumb = await shrinkImage(file, 150, 0.6);
  const r = await api('photo.upload', { productId: pid, dataUrl: full, thumbUrl: thumb, replaceId: replaceId || undefined }, { rid: rid() });
  toast(r.duplicate ? 'This photo is already saved' : 'Photo saved', 'ok'); S.thumbs[pid] = undefined; return r;
}
async function viewPhoto(pid, photoId, done) {
  const m = modal(LT('photo'), '<div class="empty">Loading...</div>', { cls: 'n', foot: `<button class="btn g" id="phRepC">${ico('camera')} Replace (camera)</button><button class="btn g" id="phRepG">${ico('img')} Replace (gallery)</button>` });
  api('photo.full', { photoId }).then(u => { m.$('.mb').innerHTML = `<img src="${u}" style="width:100%;border-radius:10px">`; }).catch(e => { m.$('.mb').textContent = e.message; });
  const rep = cap => async () => { const f = await pickFile(cap); if (!f) return; await work(null, async () => { await uploadPhoto(pid, f, photoId); m.close(); done(); }); };
  m.$('#phRepC').onclick = rep(true); m.$('#phRepG').onclick = rep(false);
}
ACT.addphoto = () => {
  const m = modal(LT('addphoto'), '<div id="pk"></div><div id="pkp" style="margin-top:12px"></div>', { cls: 'n' });
  picker(m.$('#pk'), { onPick: async p => { const full = await api('prod.get', { id: p.ProductID }, { loader: true }); m.$('#pkp').innerHTML = `<b>${esc(full.Name)}</b><div id="phbox2" style="margin-top:8px"></div>`; photoWidget(m.$('#phbox2'), p.ProductID, full.photos); } });

ACT.stockdetail = async d => {

  const s = p.stock;
  const m = modal(esc(p.Name), `<div class="grid g4" style="margin-bottom:12px">${[['physical', s.physical], ['available', s.available], ['reserved', s.reserved], ['sold', s.sold], ['returned', s.returned], ['damaged', s.damaged]].map(x => `<div class="stat"><small>${LI(x[0])}</small><b>${nf(x[1])}</b></div>`).join('')}</div>
    <div class="note info">${TRK[p.TrackingType]} · ${LT('reorder')}: ${p.ReorderLevel}${s.returned ? ' · <b>' + s.returned + ' returned item(s) waiting for inspection</b>' : ''}</div>
    <h3 style="margin:10px 0">${LI('moves')}</h3>${movesTable(mv)}`, { cls: 'w', foot: `<button class="btn g" id="dDam">${LT('damaged')} −</button>${isAdmin() && s.returned ? '<button class="btn g" id="dIns">Inspect returned</button>' : ''}${isAdmin() && s.damaged ? '<button class="btn g" id="dWo">Write off damaged</button>' : ''}<button class="btn g" id="dItems">${LI('serial')}</button><button class="btn g" id="dPr">${ico('print')}</button>` });

async function stockAdjust(p, action, title, parent) {
  let itemsHtml = '';

    itemsHtml = `<div class="fld"><label>Item</label><select id="aItem">${r.rows.map(i => `<option value="${esc(i.itemId)}">${esc(i.serial || i.itemId)} (${esc(i.itemId)})</option>`).join('')}</select></div>`;

  });

<script>
'use strict';
/* ================= views part 2: purchase, sales ================= */
const lineTrkNote = t => t === 'SERIAL' ? 'Serial number needed for each piece' : t === 'ITEMID' ? 'Each piece gets its own Item ID' : 'Quantity only';
const splitSerials = v => String(v || '').split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);

/* ---------- Purchase ---------- */
const purf = { q: '', status: '', page: 1 };

function pickFiles(camera) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*,application/pdf,.pdf';
    if (camera) i.setAttribute('capture', 'environment'); else i.multiple = true;
    i.onchange = () => res(Array.from(i.files || [])); i.click();
  });
}
function readBillFile(f) {
  if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) return new Promise((resolve, reject) => {
    if (f.size > 5000000) return reject(new Error(f.name + ': PDF is bigger than 5 MB. Take a photo of the bill instead.'));
    const fr = new FileReader(); fr.onerror = () => reject(new Error('Could not read ' + f.name)); fr.onload = () => resolve(String(fr.result).replace(/^data:[^;]*;/, 'data:application/pdf;')); fr.readAsDataURL(f);
  });
  return shrinkImage(f, 1600, 0.8);
}
function drawBills() {
  $('#pbp').innerHTML = PF.bills.map((b, i) => `<span class="tag" style="margin-right:6px">${b.pdf ? '📄' : '🖼️'} ${esc(b.name)} <b data-act="pbdel" data-i="${i}" style="margin-left:4px;cursor:pointer">✕</b></span>`).join('');
}
ACT.pbdel = d => { PF.bills.splice(+d.i, 1); drawBills(); };
async function scanBills(files) {
  const room = 6 - PF.bills.length;
  if (files.length > room) { toast('Maximum 6 bill files', 'bad'); files = files.slice(0, Math.max(room, 0)); }
  let add = 0, ok = 0, fail = [], info = '';
  for (let k = 0; k < files.length; k++) {
    const f = files[k];
    $('#pscanmsg').innerHTML = `<div class="note info">Reading bill ${k + 1} of ${files.length}... (10-20 seconds each)</div>`;
    let url; try { url = await readBillFile(f); } catch (e) { fail.push(e.message); continue; }
    PF.bills.push({ name: f.name || ('bill ' + (PF.bills.length + 1)), dataUrl: url, pdf: /^data:application\/pdf/.test(url) }); drawBills();
    try {
      const r = await api('pur.scan', { dataUrl: url });
      ok++;
      if (r.vendor && !$('#pv').value) $('#pv').value = r.vendor;
      if (r.billNo && !$('#pb').value) $('#pb').value = r.billNo;
      if (r.date && ok === 1) $('#pd').value = r.date;
      r.lines.forEach(l => { if (PF.lines.find(x => x.productId === l.productId)) return; PF.lines.push({ productId: l.productId, name: l.name, tr: l.tracking, qo: l.qty, qr: l.qty, price: l.price, ser: (l.serials || []).join('\n') }); add++; });
      r.pending.forEach(u => PF.pending.push(u));
      info = `Vendor: ${esc($('#pv').value || '?')} · Bill no: ${esc($('#pb').value || '?')}`;
    } catch (e) { fail.push((f.name || 'file') + ': ' + (e.message || 'could not read')); }
  }
  drawPurLines();
  $('#pscanmsg').innerHTML = `<div class="note info"><b>${ok} bill file(s) read.</b> ${info} · ${add} product(s) added.<br>Please CHECK name, qty and price of every line before Save.${fail.length ? `<br><span style="color:#b91c1c">${fail.map(esc).join('<br>')}</span>` : ''}${PF.pending.length ? `<br><b>${PF.pending.length} bill item(s) need your choice</b> (not found exactly in your product list) - see below.` : ''}</div>`;
  drawPending();
}

    <div class="card"><h3>${LI('customers')}</h3><div class="row"><div class="fld"><label>${LT('mobile')} *</label><input id="om" inputmode="numeric" maxlength="13" placeholder="10 digit mobile"></div><div class="fld"><label>${LT('name')} *</label><input id="on"></div><div class="fld"><label>${LT('address')}</label><input id="oa"></div></div><div id="osug"></div></div>

    <div class="card" style="margin-top:14px"><div class="row"><div class="fld"><label>${LT('status')}</label><select id="ost"><option value="Reserved">Reserved (hold stock now)</option><option value="Pending">Pending (no stock held yet)</option></select></div><div class="fld"><label>Note</label><input id="onote"></div></div>
    <div class="row" style="align-items:center"><b id="otot" class="fix" style="font-size:18px"></b><span></span><button class="btn ok fix" id="osave">${ico('down')} ${LT('save')}</button></div></div>`);
  picker($('#opk'), { placeholder: 'Search product or scan barcode / serial to add', onPick: (p, item) => addOrdLine(p, item) });
  $('#om').oninput = debounce(async () => {
    const d = $('#om').value.replace(/\D/g, ''); if (d.length < 4) return $('#osug').innerHTML = '';
    try { const r = await api('cust.search', { q: d }); OF.found = r; $('#osug').innerHTML = r.map(c => `<button class="btn g s" data-act="pickcust" data-id="${esc(c.id)}" style="margin:4px 4px 0 0">${esc(c.name)} · ${esc(c.mobile)}</button>`).join(''); } catch (e) { }
  }, 250);
  $('#osave').onclick = e => work(e.currentTarget, saveOrder);
  if (S.params.productId) { const pid = S.params.productId, it = S.params.itemId; S.params.productId = ''; S.params.itemId = ''; const p = await api('prod.get', { id: pid }); addOrdLine({ ProductID: p.ProductID, Name: p.Name, TrackingType: p.TrackingType, SellPrice: p.SellPrice }, it ? { itemId: it } : null); }
}
ACT.pickcust = d => { const c = OF.found.find(x => x.id === d.id); OF.cust = c.id; $('#om').value = c.mobile; $('#on').value = c.name; $('#oa').value = c.address || ''; $('#osug').innerHTML = `<span class="pill p-ok">✓ ${esc(c.id)}</span>`; };
async function addOrdLine(p, item) {
  if (p.TrackingType === 'QTY') {
    const ex = OF.lines.find(l => l.productId === p.ProductID); if (ex) { ex.qty = +ex.qty + 1; return drawOrdLines(); }
    OF.lines.push({ productId: p.ProductID, name: p.Name, tr: 'QTY', qty: 1, price: p.SellPrice || '', itemId: '' });
  } else {
    let itemId = item ? item.itemId : '';
    if (itemId && OF.lines.some(l => l.itemId === itemId)) return toast('This item is already added', 'bad');
    OF.lines.push({ productId: p.ProductID, name: p.Name, tr: p.TrackingType, qty: 1, price: p.SellPrice || '', itemId });
    await freeItems(p.ProductID);
  }
  drawOrdLines();
}
function drawOrdLines() {
  $('#olines').innerHTML = OF.lines.length ? OF.lines.map((l, i) => {
    const used = OF.lines.filter((x, j) => j !== i).map(x => x.itemId);
    return `<div class="card" style="border:1px solid var(--line);box-shadow:none;margin-bottom:10px" data-i="${i}"><div class="pcard">${thumbBox(l.productId)}<div style="flex:1"><b>${esc(l.name)}</b><br><span class="tag">${TRK[l.tr]}</span></div><button class="btn bad s" data-act="odel" data-i="${i}">✕</button></div>
    <div class="row" style="margin-top:8px">${l.tr === 'QTY' ? `<div class="fld"><label>${LT('qty')}</label><input type="number" min="1" data-f="qty" value="${l.qty}"></div>` : `<div class="fld"><label>${LT('serialno')} / ${LT('itemid')}</label><select data-f="itemId"><option value="">-- choose --</option>${(FREE[l.productId] || []).filter(f => f.itemId === l.itemId || used.indexOf(f.itemId) < 0).map(f => `<option value="${esc(f.itemId)}" ${f.itemId === l.itemId ? 'selected' : ''}>${esc(f.serial || f.itemId)}${f.serial ? ' (' + esc(f.itemId) + ')' : ''}</option>`).join('')}</select></div><div class="fix"><button class="btn g s" data-act="oscan" data-i="${i}">${ico('scan')}</button> <button class="btn g s" data-act="ophoto" data-i="${i}">Photo</button></div>`}
    ${isAdmin() ? `<div class="fld"><label>${LT('price')} ₹</label><input type="number" min="0" step="0.01" data-f="price" value="${l.price}" inputmode="decimal"></div>` : ''}</div></div>`;
  }).join('') : '<div class="empty">Search or scan a product to add it</div>';
  loadThumbs(OF.lines.map(l => l.productId), $('#olines')); ordTot();
}
function ordTot() { if (!isAdmin()) { $('#otot').textContent = 'Products: ' + OF.lines.length + ' · Accounts will add the price'; return; } const t = OF.lines.reduce((a, l) => a + (+l.qty || 0) * (+l.price || 0), 0); $('#otot').textContent = LT('total') + ': ' + inr(t); }
document.addEventListener('input', e => { const f = e.target.dataset && e.target.dataset.f, card = e.target.closest('#olines [data-i]'); if (f && card && OF) { OF.lines[+card.dataset.i][f] = e.target.value; ordTot(); } });
document.addEventListener('change', e => { const f = e.target.dataset && e.target.dataset.f, card = e.target.closest('#olines [data-i]'); if (f === 'itemId' && card && OF) { OF.lines[+card.dataset.i].itemId = e.target.value; drawOrdLines(); } });
ACT.odel = d => { OF.lines.splice(+d.i, 1); drawOrdLines(); };
ACT.ophoto = async d => {
  const l = OF.lines[+d.i]; const fs = await pickFiles(true); if (!fs.length) return;
  busy(true);
  try {
    const url = await shrinkImage(fs[0], 1600, 0.8);
    const r = await api('serial.photo', { dataUrl: url, productId: l.productId });
    if (r.matches.length) { l.itemId = r.matches[0].itemId; toast('Serial found: ' + (r.matches[0].serial || r.matches[0].itemId), 'ok'); drawOrdLines(); }
    else toast(r.tokens.length ? 'Not in stock. Photo shows: ' + r.tokens.join(', ') : 'Serial not found in the photo. Try a closer photo.', 'bad');
  } catch (e) { toast(e.message, 'bad'); } finally { busy(false); }
};
ACT.oscan = d => openScanner(code => { const l = OF.lines[+d.i], f = (FREE[l.productId] || []).find(x => x.serial.toUpperCase() === code.toUpperCase() || x.itemId.toUpperCase() === code.toUpperCase() || x.barcode === code); if (!f) return toast('This code is not an available item of this product', 'bad'); if (OF.lines.some((x, j) => j !== +d.i && x.itemId === f.itemId)) return toast('Already added', 'bad'); l.itemId = f.itemId; drawOrdLines(); }, LT('scanserial'));
async function saveOrder() {
  const body = { customerId: OF.cust && $('#on').value ? OF.cust : undefined, customer: { name: $('#on').value, mobile: $('#om').value, address: $('#oa').value }, status: $('#ost').value, note: $('#onote').value, lines: OF.lines.map(l => ({ productId: l.productId, qty: +l.qty, itemId: l.itemId || undefined, unitPrice: l.price === '' ? undefined : +l.price })) };
  if (!OF.lines.length) throw new Error('Add at least one product.');
  const r = await api('ord.create', body, { rid: OF.rid }); OF.rid = rid(); S.thumbs = {};
  toast('Order ' + r.orderId + ' saved', 'ok'); go('sales');
}
ACT.openorder = async d => {
  const o = await api('ord.get', { id: d.id }, { loader: true });
  const needAssign = o.status === 'Pending' && o.lines.some(l => l.tracking !== 'QTY' && !l.itemId);
  const m = modal(esc(o.orderId) + ' ' + pill(o.status), `<div class="grid g4" style="margin-bottom:10px"><div class="stat"><small>${LT('customers')}</small><b style="font-size:15px">${esc(o.customer.name)}</b></div><div class="stat"><small>${LT('mobile')}</small><b style="font-size:15px">${esc(o.customer.mobile)}</b></div><div class="stat"><small>${LT('date')}</small><b style="font-size:15px">${esc(dtm(o.date, o.at))}</b></div><div class="stat"><small>Staff</small><b style="font-size:15px">${esc(o.staff)}</b></div></div>
    ${tbl([{ h: '', k: l => thumbBox(l.productId), nl: true }, { h: LT('products'), k: l => `<b>${esc(l.name)}</b><br><small>${esc(l.model)}</small>`, nl: true }, { h: LT('serialno') + ' / ID', k: l => l.tracking === 'QTY' ? '-' : l.itemId ? esc(l.serial || l.itemId) + '<br><small>' + esc(l.itemId) + '</small>' : `<select data-assign="${l.lineId}" data-pid="${l.productId}"><option value="">-- choose --</option></select>`, l: LT('serialno') }, { h: LT('qty'), k: l => nf(l.qty), cls: 'r', l: LT('qty') }].concat(seesPrice() ? [{ h: LT('price') + ' ₹', k: l => `<input type="number" min="0" step="0.01" inputmode="decimal" style="width:110px;text-align:right" data-price="${l.lineId}" data-q="${l.qty}" value="${l.unitPrice ? l.unitPrice : ''}" placeholder="${l.suggested ? l.suggested : 'price'}">`, cls: 'r', l: LT('price') }] : []), o.lines)}
    ${seesPrice() ? `<div style="text-align:right;font-size:18px;margin-top:10px"><b>${LT('total')}: <span id="optot">${inr(o.total)}</span></b></div>` : `<div class="note info">Price will be added by Accounts.</div>`}${o.note ? `<div class="note">${esc(o.note)}</div>` : ''}`,
    { cls: 'w', foot: (seesPrice() && o.status !== 'Cancelled' ? `<button class="btn ok" id="savePrice">${ico('down')} Save price</button>` : '') + (isAcct() ? '' : o.next).map(s => `<button class="btn ${s === 'Cancelled' ? 'bad' : s === 'Delivered' ? 'ok' : ''}" data-st="${s}">${LI(STAT_KEY[s])}</button>`).join('') || `<span style="color:#64748b">No further status change</span>` });
  loadThumbs(o.lines.map(l => l.productId), m.el);
  if (needAssign) for (const s of m.$$('[data-assign]')) { const fl = await freeItems(s.dataset.pid); s.innerHTML += fl.map(f => `<option value="${esc(f.itemId)}">${esc(f.serial || f.itemId)}</option>`).join(''); }
  const _rid = rid();
  const reTot = () => { let t = 0; m.$$('[data-price]').forEach(i => { t += (+i.value || 0) * (+i.dataset.q || 0); }); const x = m.$('#optot'); if (x) x.textContent = inr(t); };
  m.$$('[data-price]').forEach(i => { i.oninput = reTot; });
  const sp = m.$('#savePrice');
  if (sp) sp.onclick = e => work(e.currentTarget, async () => {
    const lines = m.$$('[data-price]').map(i => ({ lineId: i.dataset.price, unitPrice: i.value === '' ? 0 : +i.value }));
    await api('ord.price', { orderId: o.orderId, lines }, { rid: _rid + 'P' + Date.now() }); toast('Price saved', 'ok'); m.close(); if (S.route === 'sales') loadOrders();
  });
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-st]'); if (!b) return; const st = b.dataset.st;
    if (['Cancelled', 'Delivered', 'Returned'].includes(st) && !(await confirmBox(`${st}: ${o.orderId}?`))) return;
    work(b, async () => {
      const assign = {}; m.$$('[data-assign]').forEach(s => { if (s.value) assign[s.dataset.assign] = s.value; });
      await api('ord.status', { orderId: o.orderId, status: st, assign, note: '' }, { rid: _rid + st }); toast(o.orderId + ' → ' + st, 'ok'); m.close(); S.thumbs = {}; if (S.route === 'sales') loadOrders(); else if (S.route === 'dash') V_dash();
    });
  });
};
</script>

<script>
'use strict';
/* ================= views part 3: audit, build, print, reports, users, settings ================= */

/* ---------- Stock Audit ---------- */
async function V_audit() {
  const d = await api('aud.list', { auditId: S.params.auditId }), a = isAdmin();
  const head = a ? `<button class="btn" data-act="aud_open">${ico('plus')} Start new audit</button>` : '';
  let body = '';
  if (!d.open && !d.lines.length) body = `<div class="note info">No stock audit is open. ${a ? 'Press "Start new audit", then staff can count products.' : 'Ask Admin to start a stock audit.'}</div>`;
  else {
    body += `<div class="note info">Audit <b>${esc(d.auditId || d.open)}</b> ${d.open === d.auditId ? '(open)' : '(closed)'} — staff count what they see on the shelf; they do not see system stock.</div>`;
    if (d.open && d.open === d.auditId) body += `<div class="card" style="margin-bottom:14px"><h3>${LT('count')}</h3><div id="apk"></div></div>`;
    body += tbl([{ h: LT('products'), k: l => `<b>${esc(l.product)}</b><br><small>${TRK[l.tracking] || ''}</small>`, nl: true, l: LT('products') }, { h: 'Counted', k: l => nf(l.counted) + (l.damaged ? ` <small>(${l.damaged} dmg)</small>` : ''), cls: 'r', l: 'Counted' }].concat(a ? [{ h: 'System', k: l => nf(l.system), cls: 'r', l: 'System' }, { h: 'Difference', k: l => `<span class="pill ${l.diff === 0 ? 'p-ok' : l.diff < 0 ? 'p-bad' : 'p-warn'}">${l.diff > 0 ? '+' : ''}${l.diff}</span>`, cls: 'r', l: 'Diff' }] : []).concat([{ h: 'By', k: l => esc(l.by), l: 'By' }, { h: LT('status'), k: l => pill(l.status), l: LT('status') }]).concat(a ? [{ h: '', k: l => l.status === 'Counted' ? `<button class="btn ok s" data-act="aud_yes" data-id="${l.lineId}">Approve</button> <button class="btn bad s" data-act="aud_no" data-id="${l.lineId}">Reject</button>` : '', cls: 'r', l: '' }] : []), d.lines, { click: a ? 'aud_view' : '', id: l => l.lineId, empty: 'No counts yet' });
    if (a && d.sessions.length) body += `<h3 style="margin:16px 0 8px">Audit history</h3>` + tbl([{ h: 'Audit', k: s => `<b>${esc(s.auditId)}</b>` }, { h: LT('date'), k: s => esc(s.date) }, { h: 'Lines', k: s => s.lines, cls: 'r' }, { h: 'Approved', k: s => s.approved, cls: 'r' }, { h: '', k: s => `<button class="btn g s" data-act="aud_show" data-id="${esc(s.auditId)}">${LT('viewall')}</button>`, cls: 'r' }], d.sessions);
  }
  page(LI('audit'), head, body); S._aud = d;
  if (d.open && d.open === d.auditId && $('#apk')) picker($('#apk'), { placeholder: 'Search product to count', onPick: p => countForm(p) });
}
ACT.aud_open = async () => { if (await confirmBox('Start a new stock audit? (the previous one is closed)')) work(null, async () => { await api('aud.open', {}, { rid: rid() }); S.params.auditId = ''; V_audit(); }); };
ACT.aud_show = d => { S.params.auditId = d.id; V_audit(); };
ACT.aud_yes = d => work(null, async () => { const r = await api('aud.decide', { lineId: d.id, decision: 'APPROVE' }, { rid: rid() }); toast('Approved' + (r.notes && r.notes.length ? ' — ' + r.notes.join('; ') : ''), 'ok'); V_audit(); });
ACT.aud_no = d => work(null, async () => { await api('aud.decide', { lineId: d.id, decision: 'REJECT' }, { rid: rid() }); V_audit(); });
ACT.aud_view = d => {
  const l = (S._aud.lines || []).find(x => x.lineId === d.id); if (!l) return; const f = l.findings || {};
  const sec = (t, arr) => arr && arr.length ? `<h3 style="margin:10px 0 4px">${t} (${arr.length})</h3><ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  modal(esc(l.product), `<div class="grid g3"><div class="stat"><small>System</small><b>${l.system}</b></div><div class="stat"><small>Counted</small><b>${l.counted}</b></div><div class="stat"><small>Difference</small><b>${l.diff}</b></div></div>${sec('Missing stock', f.missing)}${sec('Unregistered items', f.unregistered)}${sec('Duplicate scans', f.duplicate)}${sec('Wrong product', f.wrong)}${sec('Damaged found', f.damagedFound)}${l.note ? `<div class="note">${esc(l.note)}</div>` : ''}`, { cls: 'n' });
};
function countForm(p) {
  const tr = p.TrackingType, scanned = [];
  const m = modal(esc(p.Name), tr === 'QTY' ? `<div class="row"><div class="fld"><label>Counted on shelf (all pieces)</label><input id="cc" type="number" min="0" inputmode="numeric"></div><div class="fld"><label>Out of these, damaged</label><input id="cd" type="number" min="0" value="0"></div></div>`
    : `<div class="note info">Scan or type every piece you can see (serial / Item ID).</div><div class="row"><div class="fld"><input id="cs" placeholder="Serial / Item ID, press Enter" autocomplete="off"></div><div class="fix"><button class="btn g" id="cscan">${ico('scan')}</button></div></div><div id="clist" style="margin-top:8px"></div>`, { cls: 'n', foot: `<button class="btn" id="cgo">${LT('save')}</button>` });
  const draw = () => { m.$('#clist').innerHTML = `<b>${scanned.length}</b> scanned<br>` + scanned.map((c, i) => `<span class="pill" style="margin:2px">${esc(c)} <a data-rm="${i}" style="cursor:pointer">✕</a></span>`).join(''); };
  if (tr !== 'QTY') {
    const add = v => { v = v.trim(); if (v) { scanned.push(v); draw(); } }; draw();
    m.$('#cs').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(e.target.value); e.target.value = ''; } };
    m.$('#cscan').onclick = () => openScanner(c => add(c), LT('scan'));
    m.el.addEventListener('click', e => { const r = e.target.closest('[data-rm]'); if (r) { scanned.splice(+r.dataset.rm, 1); draw(); } });
  }
  const _rid = rid();
  m.$('#cgo').onclick = e => work(e.currentTarget, async () => {
    const r = await api('aud.count', { productId: p.ProductID, counted: tr === 'QTY' ? m.$('#cc').value : undefined, damaged: tr === 'QTY' ? m.$('#cd').value : undefined, scanned: tr === 'QTY' ? undefined : scanned }, { rid: _rid });
    toast('Count saved: ' + r.counted, 'ok'); m.close(); V_audit();
  });
}

/* ---------- Build PC ---------- */
const bf = { q: '', status: '' };
async function V_build() {
  page(LI('build'), `<button class="btn" data-act="newbuild">${ico('plus')} New Build</button>`, `<div class="tools"><input id="bq" placeholder="Build ID / ${LT('name')}" value="${esc(bf.q)}"><select id="bs"><option value="">${LT('all')}</option>${['Draft', 'Completed', 'Delivered', 'Cancelled'].map(s => `<option ${s === bf.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div><div id="blist">${skel()}</div>`);
  const re = debounce(() => { bf.q = $('#bq').value; bf.status = $('#bs').value; loadBuilds(); }, 250); $('#bq').oninput = re; $('#bs').onchange = re; loadBuilds();
}
async function loadBuilds() { const r = await api('build.list', bf); $('#blist').innerHTML = tbl([{ h: 'Build ID', k: b => `<b>${esc(b.buildId)}</b>`, l: 'ID' }, { h: LT('name'), k: b => esc(b.name), l: LT('name') }, { h: LT('customers'), k: b => esc(b.customer) + (b.mobile ? '<br><small>' + esc(b.mobile) + '</small>' : ''), l: LT('customers') }, { h: 'Parts', k: b => b.components, cls: 'r', l: 'Parts' }, { h: LT('date'), k: b => esc(dtm('', b.createdAt)), l: LT('date') }, { h: LT('status'), k: b => pill(b.status), l: LT('status') }], r, { click: 'openbuild', id: b => b.buildId, empty: 'No builds yet' }); }
ACT.newbuild = () => {
  const m = modal('New Build', `<div class="fld"><label>${LT('name')} * (example: i5 7th Gen, 8GB, 256GB)</label><input id="bn"></div><div class="row"><div class="fld"><label>${LT('customers')} ${LT('name')}</label><input id="bcn"></div><div class="fld"><label>${LT('mobile')}</label><input id="bcm" inputmode="numeric"></div></div>`, { cls: 'n', foot: `<button class="btn" id="bgo">${LT('save')}</button>` });
  const _rid = rid(); m.$('#bgo').onclick = e => work(e.currentTarget, async () => { const r = await api('build.create', { name: m.$('#bn').value, customer: { name: m.$('#bcn').value, mobile: m.$('#bcm').value } }, { rid: _rid }); m.close(); ACT.openbuild({ id: r.buildId }); });
};
ACT.openbuild = async d => {
  const b = await api('build.get', { id: d.id }, { loader: true }), open = b.status === 'Draft' || b.status === 'Completed';
  const m = modal(esc(b.buildId) + ' · ' + esc(b.name) + ' ' + pill(b.status), `${b.customer ? `<div class="note info">${esc(b.customer.name)} · ${esc(b.customer.mobile)}</div>` : ''}
    ${open ? `<div class="card" style="border:1px solid var(--line);box-shadow:none;margin-bottom:12px"><h3>Add component</h3><div class="row"><div class="fld"><label>Type</label><select id="bt">${b.types.map(t => `<option>${t}</option>`).join('')}</select></div><div class="fld"><label>Scan serial / Item ID</label><input id="bc" placeholder="Serial / Item ID" autocomplete="off"></div><div class="fix"><button class="btn g" id="bscan">${ico('scan')}</button> <button class="btn" id="badd">${LT('add')}</button></div></div><div class="note info" style="margin:6px 0 0">Mouse, cable or other quantity items: search them here:</div><div id="bpk"></div><div class="row" id="bq2" style="display:none;margin-top:8px"><div class="fld"><label id="bql"></label><input type="number" id="bqty" min="1" value="1"></div><div class="fix"><button class="btn" id="bqa">${LT('add')}</button></div></div></div>` : ''}
    ${tbl([{ h: 'Type', k: c => `<span class="tag">${esc(c.type)}</span>`, l: 'Type' }, { h: LT('products'), k: c => esc(c.name), nl: true, l: LT('products') }, { h: LT('serialno') + ' / ID', k: c => c.itemId ? esc(c.serial || c.itemId) + '<br><small>' + esc(c.itemId) + '</small>' : '-', l: LT('serialno') }, { h: LT('qty'), k: c => c.qty, cls: 'r', l: LT('qty') }, { h: '', k: c => open ? `<button class="btn bad s" data-rm="${c.lineId}">✕</button>` : '', cls: 'r' }], b.components, { empty: 'No components yet' })}`,
    { cls: 'w', foot: b.next.map(s => `<button class="btn ${s === 'Cancelled' ? 'bad' : s === 'Delivered' ? 'ok' : ''}" data-st="${s}">${s}</button>`).join('') + (b.components.length ? `<button class="btn g" id="bpr">${ico('print')}</button>` : '') });
  const refresh = () => { m.close(); ACT.openbuild({ id: b.buildId }); if (S.route === 'build') loadBuilds(); };
  const add = body => work(null, async () => { await api('build.add', Object.assign({ buildId: b.buildId }, body), { rid: rid() }); refresh(); });
  if (open) {
    m.$('#badd').onclick = () => add({ type: m.$('#bt').value, code: m.$('#bc').value }); m.$('#bc').onkeydown = e => { if (e.key === 'Enter') add({ type: m.$('#bt').value, code: m.$('#bc').value }); };
    m.$('#bscan').onclick = () => openScanner(c => add({ type: m.$('#bt').value, code: c }), LT('scan'));
    let pp = null; picker(m.$('#bpk'), { placeholder: 'Quantity item (mouse, cable...)', onPick: p => { if (p.TrackingType !== 'QTY') return toast('This product is tracked by serial — scan its serial above.', 'bad'); pp = p; m.$('#bq2').style.display = ''; m.$('#bql').textContent = p.Name + ' — ' + LT('qty'); } });

const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function qcalc(e) {
  let gross = 0, ld = 0; const base = e.lines.map(l => { const g = (+l.qty || 0) * (+l.unitPrice || 0), d = Math.min(Math.max(0, +l.lineDisc || 0), g); gross += g; ld += d; return g - d; });
  const after = gross - ld, bill = Math.min(Math.max(0, +e.billDisc || 0), after); let taxable = 0, tax = 0, cost = 0; const brk = {};
  e.lines.forEach((l, i) => {
    const t = after > 0 ? base[i] - bill * base[i] / after : 0, rate = e.gst ? (l.gstRate === '' || l.gstRate == null ? +e.gstRate : +l.gstRate) : 0, tx = r2(t * rate / 100);
    l._tx = tx; l._tot = r2(t + tx); taxable += r2(t); tax += tx; cost += (+l.cost || 0) * (+l.qty || 0);
    const b = brk[rate] = brk[rate] || { rate, taxable: 0, tax: 0 }; b.taxable += r2(t); b.tax += tx;
  });

  return { gross: r2(gross), ld: r2(ld), bill: r2(bill), disc: r2(ld + bill), taxable: r2(taxable), tax: r2(tax), round: r2(total - exact), total, cost: r2(cost), profit: r2(taxable - cost), brk: Object.values(brk).filter(b => b.rate > 0) };
}

ACT.qbulk = (d, el) => work(el, async () => {

<script>

/* ================= Cash Book (same data as the old CRM Cash Book, same look) ================= */
const CB = { month: new Date().toISOString().slice(0, 7), q: '', type: '', mode: '', by: '', range: 'all', from: '', to: '', view: 'hist', data: null };

function cbRange() {
  const r = CB.range, t = cbDay(0);
  if (r === 'today') return { from: t, to: t };
  if (r === 'yday') return { from: cbDay(-1), to: cbDay(-1) };
  if (r === 'week') return { from: cbDay(-6), to: t };
  if (r === 'month') return { from: t.slice(0, 7) + '-01', to: t.slice(0, 7) + '-31' };
  if (r === 'custom') return { from: CB.from, to: CB.to };

}

}
/* All filtering is done here in the browser, so every button reacts instantly. */
function cbCalc(d) {

  const scope = all.filter(r => inRange(r) && (!CB.mode || r.mode === CB.mode));
  const view = { in: 0, out: 0 }; scope.forEach(r => { if (r.type === 'in') view.in += r.amount; else view.out += r.amount; }); view.bal = view.in - view.out;
  const q = CB.q.trim().toLowerCase();
  const rows = scope.filter(r => (!CB.type || r.type === CB.type) && (!CB.by || r.by === CB.by) && (!q || (r.party + ' ' + r.note + ' ' + r.cat + ' ' + r.amount).toLowerCase().includes(q)));
  const dm = {};

  <div class="card"><div class="cbrow"><b>Tarikh pramane jovo</b><span><input type="date" id="cbf" value="${esc(CB.from)}"> thi <input type="date" id="cbt" value="${esc(CB.to)}"> sudhi</span></div>
    <div class="cbpills">${[['today', 'Aaje'], ['yday', 'Kaal'], ['week', 'Aa week'], ['month', 'Aa mahino'], ['all', 'Badha divas']].map(x => `<button class="pillb ${CB.range === x[0] && CB.view === 'hist' ? 'on' : ''}" data-act="cbrange" data-r="${x[0]}">${x[1]}</button>`).join('')}<button class="pillb ${CB.view === 'days' ? 'on' : ''}" data-act="cbdays">Roj na total</button></div></div>
  <div class="card cbsum"><b>${CB.mode ? esc(CB.mode) : 'Badhi'} ni noondh</b> — IN <b style="color:#15803d">${inr(vm.view.in)}</b> | OUT <b style="color:#d92d20">${inr(vm.view.out)}</b> | Balance <b>${inr(vm.view.bal)}</b> ${CB.mode ? '<button class="pillb" data-act="cbacct" data-m="">Badhu jovo</button>' : ''}</div>`;
  if (CB.view === 'days') {
    h += `<h3 style="margin:14px 0 6px">Roj na total</h3>` + tbl([{ h: 'Date', k: r => dtm(r.date) }, { h: 'IN', cls: 'r', k: r => `<span style="color:#15803d">${inr(r.in)}</span>` }, { h: 'OUT', cls: 'r', k: r => `<span style="color:#d92d20">${inr(r.out)}</span>` }], vm.days, { empty: 'No entries' });
  } else {
    h += `<div class="cbrow" style="margin-top:12px"><h3 style="margin:0">Complete History <small>(${nf(vm.count)})</small></h3><span class="cbflt"><input id="cbq" placeholder="Search..." value="${esc(CB.q)}"><select id="cbty"><option value="">All Type</option><option value="in" ${CB.type === 'in' ? 'selected' : ''}>IN</option><option value="out" ${CB.type === 'out' ? 'selected' : ''}>OUT</option></select><select id="cbmo"><option value="">All Accounts</option>${op(ac, CB.mode)}</select><select id="cbby"><option value="">All Entry By</option>${op(d.by, CB.by)}</select></span></div>`;
    h += tbl([{ h: 'Date', k: r => `${esc(r.date)}<br><small>${cbT12(r.time)}</small>` }, { h: 'Category', k: r => esc(r.cat) }, { h: 'Party', k: r => esc(r.party) + (r.note ? `<br><small>${esc(r.note)}</small>` : '') }, { h: 'Account', k: r => esc(r.mode) },
      { h: 'In', k: r => r.type === 'in' ? `<b style="color:#15803d">${inr(r.amount)}</b>` : '' }, { h: 'Out', k: r => r.type === 'out' ? `<b style="color:#d92d20">${inr(r.amount)}</b>` : '' },
      ...(vm.rows.some(r => r.bal !== undefined) ? [{ h: 'Balance', k: r => r.bal === undefined ? '' : inr(r.bal) }] : []),
      { h: 'By', k: r => `<small>${esc(r.by)}</small>` },
      ...(ad ? [{ h: '', nl: 1, k: r => `<button class="btn g s" data-act="cbedit" data-id="${esc(r.id)}">Edit</button> <button class="btn g s" style="color:#d92d20" data-act="cbdel" data-id="${esc(r.id)}">Delete</button>` }] : [])], vm.rows, { empty: 'No entries' });
  }
  page('Cash Book', '', h); window.scrollTo(0, _sy);
  if (_fk) { const e = $('#' + _fk.id); if (e) { e.focus(); try { e.setSelectionRange(_fk.s, _fk.s); } catch (x) {} } }
  $('#cbm').onchange = () => { CB.month = $('#cbm').value || CB.month; loadCash(); };
  const bind = (id, k, fn) => { const e = $('#' + id); if (e) e.onchange = () => { CB[k] = e.value; if (fn) fn(); drawCash(); }; };
  bind('cbty', 'type'); bind('cbmo', 'mode'); bind('cbby', 'by');
  bind('cbf', 'from', () => { CB.range = 'custom'; CB.view = 'hist'; }); bind('cbt', 'to', () => { CB.range = 'custom'; CB.view = 'hist'; });
  const q = $('#cbq'); if (q) q.oninput = debounce(() => { CB.q = q.value; drawCash(); }, 200);

}
