ACT.cbacct = d => { CB.mode = d.m || ''; CB.type = ''; CB.q = ''; CB.by = ''; CB.view = 'hist'; drawCash(); };
ACT.cbrange = d => { CB.range = d.r; CB.view = 'hist'; CB.from = ''; CB.to = ''; drawCash(); };
ACT.cbdays = () => { CB.view = CB.view === 'days' ? 'hist' : 'days'; drawCash(); };
ACT.cbsave = (d, el) => work(el, async () => {
  await api('cash.add', { _rid: rid(), type: $('#cfty').value, cat: $('#cfc').value, party: $('#cfp').value, note: $('#cfn').value, amount: $('#cfa').value, mode: $('#cfm').value, date: $('#cfd').value });
  ['cfp', 'cfn', 'cfa'].forEach(k => $('#' + k).value = ''); toast('Saved'); await loadCash();
});
ACT.cbtrf = (d, el) => work(el, async () => {
  await api('cash.transfer', { _rid: rid(), from: $('#tf').value, to: $('#tt').value, amount: $('#ta').value, note: $('#tn').value, date: $('#td').value });
  ['ta', 'tn'].forEach(k => $('#' + k).value = ''); toast('Transfer saved'); await loadCash();
});
function cbEditForm(r) {
  const out = r.type === 'out', cats = out ? CB_CATS_OUT : CB_CATS_IN, isT = r.cat === 'Transfer' || r.cat === 'Opening Balance';
  const catList = cats.includes(r.cat) ? cats : cats.concat([r.cat]);
  return `<div class="fld"><label>Type</label><select id="ef_t"><option value="in" ${!out ? 'selected' : ''}>Money IN</option><option value="out" ${out ? 'selected' : ''}>Money OUT</option></select></div>
  ${isT ? '' : `<div class="fld"><label>Category</label><select id="ef_c">${catList.map(c => `<option ${r.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>`}
  <div class="fld"><label>Party / Customer</label><input id="ef_p" value="${esc(r.party)}"></div><div class="fld"><label>Reason / note</label><input id="ef_n" value="${esc(r.note)}"></div>
  <div class="fld"><label>Amount</label><input id="ef_a" type="number" inputmode="decimal" value="${r.amount}"></div>
  <div class="fld"><label>Account</label><select id="ef_m">${CB.data.accts.map(a => `<option ${r.mode === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
  <div class="fld"><label>Date</label><input id="ef_d" type="date" value="${r.date}"></div>`;
}
ACT.cbedit = d => {
  const r = CB.data.rows.find(x => x.id === d.id); if (!r) return;
  const m = modal('Edit entry', cbEditForm(r) + (r.cat === 'Transfer' ? '<div class="note">Transfer has 2 lines (OUT and IN). Change both lines.</div>' : ''), { foot: '<button class="btn" id="efs">Save</button>' });
  m.$('#efs').onclick = e => work(e.currentTarget, async () => {
    await api('cash.edit', { _rid: rid(), id: r.id, type: m.$('#ef_t').value, cat: m.$('#ef_c') ? m.$('#ef_c').value : r.cat, party: m.$('#ef_p').value, note: m.$('#ef_n').value, amount: m.$('#ef_a').value, mode: m.$('#ef_m').value, date: m.$('#ef_d').value });
    m.close(); toast('Updated'); loadCash();
  });
};
ACT.cbdel = d => work(null, async () => {
  const r = CB.data.rows.find(x => x.id === d.id); if (!r) return;
  if (!(await confirmBox(`Delete ${r.type.toUpperCase()} ${inr(r.amount)} (${r.party || r.cat})?${r.cat === 'Transfer' ? ' Delete the other transfer line too.' : ''}`))) return;
  await api('cash.del', { _rid: rid(), id: r.id }); toast('Deleted'); loadCash();
});

<script>
'use strict';
/* ================= main: login, shell, routing, init ================= */
const ROUTES = {
  dash: () => V_dash(), products: () => V_products(), purchase: () => V_purchase(), sales: () => V_sales(), stock: () => V_stock(),
  serial: () => V_serial(), customers: () => V_customers(), reports: () => V_reports(), audit: () => V_audit(), build: () => V_build(),
  print: () => V_print(), users: () => V_users(), settings: () => V_settings(), scan: () => V_scan(), crm: () => V_crm(), service: () => V_service(), quotes: () => V_quotes(), quote: () => V_quote(), cash: () => V_cash()
};
const ADMIN_ONLY = ['users', 'settings'];
/* Which menus each staff member sees (by name). Admin sees everything. */
const STAFF_MENUS = { USTAV: ['quotes', 'crm', 'sales', 'build', 'serial', 'products'], NAKUL: ['quotes', 'crm', 'cash', 'purchase', 'sales', 'stock'] };
function userMenus() {
  if (!S.user || isAdmin() || isAcct()) return null;
  const k = String(S.user.name || '').trim().split(/\s+/)[0].toUpperCase(), k2 = String(S.user.loginId || '').trim().toUpperCase();
  return STAFF_MENUS[k] || STAFF_MENUS[k2] || null;
}
function navItems() {
  const a = isAdmin();
  if (isAcct()) return ['sales', 'customers'];
  if (userMenus()) return userMenus();
  const l = ['dash', 'products', 'purchase', 'sales', 'quotes', 'stock', 'serial', 'customers', 'build', 'audit', 'print', 'reports', 'service', 'cash', 'crm'];
  if (a) l.push('users', 'settings');
  return l;
}

/* ---------- navigation ---------- */
function go(route, params, noPush) {
  { const um = userMenus(); if (um && !um.includes(route) && !(route === 'quote' && um.includes('quotes'))) route = um[0]; }
  if (route === 'crm' && isAdmin()) { const w = window.open(CRM_URL, '_blank'); if (!w) modal('CRM', `<p>Tap the button to open CRM.</p><a class="btn ok" href="${CRM_URL}" target="_blank" rel="noopener">Open CRM</a>`, { cls: 'n' }); return; }
  if (isAcct() && !['sales', 'customers'].includes(route)) route = 'sales';
  if (!ROUTES[route] || (ADMIN_ONLY.includes(route) && !isAdmin())) route = isAcct() ? 'sales' : 'dash';
  if (!noPush && S.route !== route || (!noPush && params && Object.keys(params).length)) S.stack.push({ route: S.route, params: S.params });
  if (S.stack.length > 30) S.stack.shift();
  S.route = route; S.params = Object.assign({}, params || {});
  store.set('route', route);
  $$('.side a, .bnav a[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === route));
  $('.side') && $('.side').classList.remove('open'); const sd = $('#sdrop'); if (sd) sd.innerHTML = '';
  try { const r = ROUTES[route](); if (r && r.catch) r.catch(e => { $('#page').innerHTML = `<div class="note">${esc(e.message)}</div>`; }); }
  catch (e) { $('#page').innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}
ACT.go = d => { const p = {}; Object.keys(d).forEach(k => { if (!['act', 'r', 'i', 'id'].includes(k)) p[k === 'pid' ? 'productId' : k] = d[k]; }); go(d.r || 'dash', p); };
ACT.back = () => { const b = S.stack.pop(); if (b) go(b.route, b.params, true); else go('dash', {}, true); };

/* one delegated click handler for every data-act button */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  try { const r = f(el.dataset, el, e); if (r && r.catch) r.catch(err => toast(err.message, 'bad')); } catch (err) { toast(err.message, 'bad'); }
});

/* ---------- language ---------- */
function setLang(l) { S.lang = l; store.lset('lang', l); renderShell(); go(S.route, S.params, true); }
ACT.lang = d => setLang(d.l);

/* ---------- login ---------- */
function loginClock() {
  const el = $('#lgclk'); if (!el) return;
  const d = new Date(), DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  el.innerHTML = `<b>${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}</b><small>${DAYS[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}</small>`;
}
function loginWeek() {
  const d = new Date(), DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], st = new Date(d); st.setDate(d.getDate() - d.getDay());
  let o = '';
  for (let i = 0; i < 7; i++) { const x = new Date(st); x.setDate(st.getDate() + i); o += `<div class="${x.toDateString() === d.toDateString() ? 't' : ''}">${DAYS[i]}<b>${x.getDate()}</b></div>`; }
  return `<div class="mo"><span>${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][d.getMonth()]} ${d.getFullYear()}</span><span>This week</span></div><div class="wk">${o}</div>`;
}
function greetWord() { const h = new Date().getHours(); return h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening'; }
function showSplash(name) {
  let el = $('#splash');
  if (!el) { el = document.createElement('div'); el.id = 'splash'; el.className = 'splash'; document.body.appendChild(el); window._splT = Date.now(); }
  const f = String(name || '').trim().split(/\s+/)[0];
  el.innerHTML = `<img src="${window.LOGO}" alt="C COMPUTER"><h1>${greetWord()}${f ? ', ' + esc(f) : ''}!</h1><div class="bars"><i></i><i></i><i></i></div>`;
}
function hideSplash() {
  const el = $('#splash'); if (!el) return;
  const wait = Math.max(0, 1500 - (Date.now() - (window._splT || 0)));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 450); }, wait);
}
function renderLogin(msg) {
  S.token = null; S.user = null; document.body.classList.remove('in'); hideSplash();
  $('#root').innerHTML = `<div class="dl"><div class="bgb" style="background-image:url(${window.DREAM})"></div><div class="bgp" style="background-image:url(${window.innerWidth > 820 ? window.DREAMW : window.DREAM})"></div>
    <div class="qt"><q>“Dream Big. Work Hard. Make It Real.”</q><b>Yogesh Bhai</b><small>Founder, C COMPUTER · The Computer House</small></div>
    <form class="card" id="lf" autocomplete="off">
      <div class="brand"><img src="${window.LOGO}" alt="C COMPUTER">C COMPUTER</div>
      <div class="gm">${greetWord()}</div><h2>Welcome back!</h2><p class="sub">Please enter your Login ID and PIN to continue.</p>
      ${msg ? `<div class="note">${esc(msg)}</div>` : ''}
      <div class="fld"><label>${LT('loginid')} *</label><input id="li" autocapitalize="off" autocomplete="username" required></div>
      <div class="fld"><label>PIN *</label><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" required></div>
      <button class="go" id="lgo">${LT('login')}</button>
      <div class="lang" id="llang">${Object.keys(LANGS).map(k => `<button type="button" data-l="${k}" class="${S.lang === k ? 'on' : ''}">${LANGS[k]}</button>`).join('')}</div>
      <div class="ft">Sales | Service | Accessories · Katargam, Surat</div></form></div>`;
  $$('#llang button').forEach(b => b.onclick = () => { S.lang = b.dataset.l; store.lset('lang', S.lang); renderLogin(msg); });
  $('#lf').onsubmit = ev => {
    ev.preventDefault(); const btn = $('#lgo'); if (btn.disabled) return; btn.disabled = true;
    busy(true);
    google.script.run.withSuccessHandler(r => {
      busy(false); btn.disabled = false;
      if (!r || !r.ok) { $('#lp').value = ''; return toast((r && r.error) || 'Login failed', 'bad'); }
      S.token = r.data.token; S.user = r.data.user; store.set('tok', S.token); startApp();
    }).withFailureHandler(() => { busy(false); btn.disabled = false; toast('Network problem. Check internet and try again.', 'bad'); })
      .api(null, 'login', { loginId: $('#li').value, pin: $('#lp').value });
  };
  setTimeout(() => $('#li') && $('#li').focus(), 50);
}
function doLogout(auto) {
  const t = S.token; S.stack = []; store.del('tok'); store.del('route');
  if (t && !auto) { try { google.script.run.api(t, 'logout', {}); } catch (e) { } }
  S.token = null; S.user = null; S.boot = null; PQ && (PQ.items = []);
  renderLogin(auto ? 'Session ended. Please login again.' : '');
}
ACT.logout = () => doLogout(false);
ACT.svshow = (d, el) => { const v = $('#sval'); if (!v) return; const hid = v.textContent.indexOf('•') >= 0; v.textContent = hid ? v.dataset.v : '₹ ••••••'; (el || $('[data-act=svshow]')).textContent = hid ? 'Hide' : 'Show'; };

/* ---------- shell ---------- */
function renderShell() {
  if (!S.user) return;
  const a = isAdmin(), items = navItems();
  const nm = S.user.name || S.user.loginId;
  $('#root').innerHTML = `<div class="app">
    <aside class="side"><div class="brand"><img src="${window.LOGO}" alt="C COMPUTER"></div><nav>${items.map(k => `<a data-act="go" data-r="${k}" class="${S.route === k ? 'on' : ''}">${ico(k)}<span>${LI(k)}</span></a>`).join('')}</nav><div class="ver">C COMPUTER ERP · ${a ? 'Admin' : 'Staff'}</div></aside>
    <div class="main">
      <header class="top"><button class="ibtn burger" id="burger">${ico('menu')}</button>
        <div class="sbox">${ico('search')}<input id="gs" placeholder="${LT('search')}" autocomplete="off"><div id="sdrop"></div></div>
        <button class="ibtn" data-act="scanhome" title="${LT('scan')}">${ico('scan')}</button>
        <div class="lang">${Object.keys(LANGS).map(k => `<button data-act="lang" data-l="${k}" class="${S.lang === k ? 'on' : ''}">${LANGS[k]}</button>`).join('')}</div>
        <div class="me" id="me"><div class="av">${esc(nm.charAt(0).toUpperCase())}</div><div style="line-height:1.15"><b style="font-size:13px">${esc(nm)}</b><br><small style="color:#64748b">${a ? 'Admin' : 'Staff'}</small></div></div>
      </header>
      <main id="page" class="page"></main></div>
    <nav class="bnav" ${userMenus() ? 'style="display:none"' : ''}><a data-act="go" data-r="dash" data-r2="dash" class="${S.route === 'dash' ? 'on' : ''}" data-r="dash">${ico('dash')}${LT('home')}</a>
      <a data-act="go" data-r="products" class="${S.route === 'products' ? 'on' : ''}">${ico('products')}${LT('products')}</a>
      <a class="plus" data-act="plus">${ico('plus')}</a>
      <a data-act="go" data-r="stock" class="${S.route === 'stock' ? 'on' : ''}">${ico('stock')}${LT('stock')}</a>
      <a data-act="more">${ico('menu')}${LT('more')}</a></nav></div>`;
  $('#burger').onclick = () => $('.side').classList.toggle('open');
  $('#me').onclick = userMenu;
  const gs = $('#gs');
  gs.oninput = debounce(async () => {
    const q = gs.value.trim(), box = $('#sdrop'); if (q.length < 2) { box.innerHTML = ''; return; }
    try {
      const r = await api('search', { q }); if (gs.value.trim() !== q) return;
      const grp = (t, arr, act, key) => arr.length ? `<div class="g">${t}</div>` + arr.map(x => `<div class="it" data-act="${act}" data-id="${esc(x.id)}" data-code="${esc(x.id)}"><span>${esc(x.name)}</span><small>${esc(x.sub)}</small></div>`).join('') : '';
      const html = grp(LT('products'), r.products, 'sr_prod') + grp(LT('customers'), r.customers, 'sr_cust') + grp(LT('orders'), r.orders, 'sr_ord') + grp('Serial / Item', r.items, 'sr_item');
      box.innerHTML = `<div class="drop">${html || '<div class="it"><small>Nothing found</small></div>'}</div>`;
    } catch (e) { box.innerHTML = ''; }
  }, 250);
  gs.onkeydown = e => { if (e.key === 'Escape') { gs.value = ''; $('#sdrop').innerHTML = ''; } };
  document.addEventListener('click', ev => { if (!ev.target.closest('.sbox')) { const d = $('#sdrop'); if (d) d.innerHTML = ''; } }, { once: false });
}
const closeSearch = () => { const g = $('#gs'); if (g) g.value = ''; const d = $('#sdrop'); if (d) d.innerHTML = ''; };
ACT.sr_prod = d => { closeSearch(); go('products'); setTimeout(() => ACT.openprod({ id: d.id }), 50); };
ACT.sr_cust = d => { closeSearch(); go('customers'); setTimeout(() => ACT.opencust({ id: d.id }), 50); };
ACT.sr_ord = d => { closeSearch(); go('sales'); setTimeout(() => ACT.openorder({ id: d.id }), 50); };
ACT.sr_item = d => { closeSearch(); go('serial'); setTimeout(() => ACT.openitem({ id: d.id }), 50); };

/* mobile: + button and More sheet */
function sheet(title, entries) {
  const m = modal(title, `<div class="tiles">${entries.map(e => `<div class="tile" data-sh="${e[0]}">${ico(e[1])}${e[2]}</div>`).join('')}</div>`, { cls: 'n' });
  m.el.addEventListener('click', ev => { const t = ev.target.closest('[data-sh]'); if (!t) return; const e = entries.find(x => x[0] === t.dataset.sh); m.close(); e[3](); });
}
ACT.plus = () => sheet('+', [
  ['o', 'sales', LI('neworder'), () => go('sales', { new: 1 })], ['p', 'purchase', LI('newpurchase'), () => go('purchase', { new: 1 })],
  ['s', 'scan', LI('scanbarcode'), () => go('scan')], ['c', 'customers', LT('add') + ' ' + LT('customers'), () => { go('customers'); setTimeout(() => ACT.newcust(), 60); }]]);
ACT.more = () => sheet(LT('more'), navItems().filter(k => !['dash', 'products', 'stock'].includes(k)).map(k => [k, k, LI(k), () => go(k)]));
ACT.scanhome = () => go('scan');

/* user menu: change PIN, logout */
function userMenu() {
  const m = modal(esc(S.user.name || S.user.loginId), `<div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile" data-u="pin">${ico('lock')}${LI('changepin')}</div><div class="tile" data-u="out">${ico('logout')}${LI('logout')}</div></div>`, { cls: 'n' });
  m.el.addEventListener('click', e => { const t = e.target.closest('[data-u]'); if (!t) return; m.close(); t.dataset.u === 'pin' ? pinForm() : doLogout(false); });
}
function pinForm() {
  const m = modal(LI('changepin'), `<div class="fld"><label>Current PIN</label><input id="p0" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></div><div class="row"><div class="fld"><label>New PIN (4-8 digits)</label><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="fld"><label>Repeat new PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div>`, { cls: 'n', foot: `<button class="btn" id="pgo">${LT('save')}</button>` });
  m.$('#pgo').onclick = e => work(e.currentTarget, async () => {
    if (m.$('#p1').value !== m.$('#p2').value) throw new Error('New PIN and repeat PIN are not the same');
    await api('changePin', { oldPin: m.$('#p0').value, newPin: m.$('#p1').value }); toast('PIN changed', 'ok'); m.close();
  });
}

/* auto logout after 30 min idle (server session is 6 h) */
let idleT; const IDLE = 30 * 60 * 1000;
function idleReset() { clearTimeout(idleT); if (S.token) idleT = setTimeout(() => doLogout(true), IDLE); }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, idleReset, { passive: true }));

/* ---------- start ---------- */
async function startApp() {
  showSplash(S.user && S.user.name);
  try {
    S.boot = await api('bootstrap', {});
    S.user = S.boot.user; S.lang = store.lget('lang') || S.boot.lang || 'both';
    document.body.classList.add('in'); renderShell(); idleReset();
    const r = store.get('route'); go(r && ROUTES[r] ? r : (isAcct() ? 'sales' : 'dash'), {}, true); showSplash(S.user.name); hideSplash();
  } catch (e) { renderLogin(e.message); }
}
(function init() {
  S.lang = store.lget('lang') || 'both';
  const t = store.get('tok');
  if (t) { S.token = t; startApp(); } else renderLogin();
})();
</script>
