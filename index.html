ACT.brecopen = async d => {
  const ph = modal(esc(d.id), skel(), { cls: 'w' });
  let b; try { b = await api('brec.get', { id: d.id }); } catch (e) { ph.close(); toast(e.message, 'bad'); return; }
  ph.close();
  const sp = x => x.part === 'Monitor' && /^[\d.]+$/.test(x.spec) ? x.spec + ' inch' : x.spec;
  const row = x => `<tr><td><b>${esc(x.part)}</b>${x.brand ? '<br><small>' + esc(x.brand) + '</small>' : ''}${sp(x) ? '<br><small>' + esc(sp(x)) + '</small>' : ''}${x.changedFrom ? '<br><small class="brchg">Badlayu: ' + esc(x.by) + ' · ' + esc(dtm('', x.at)) + '</small>' : ''}${b.status === 'Cancelled' ? '' : `<br><button class="btn g s" data-chg="${x.partId}" style="margin-top:4px">Badlo</button>`}</td><td>${x.serial ? '<b>' + esc(x.serial) + '</b>' : '<small>Serial nathi</small>'}</td><td>${x.thumb ? `<img class="brth" src="${x.thumb}" data-ph="${x.partId}" alt="">` : '-'}</td></tr>`;
  const m = modal(esc(b.recId) + ' · ' + esc((BR_KINDS.find(k => k[0] === b.kind) || [])[1] || b.kind), `<div class="note info"><b>${esc(b.customer.name)}</b>${b.customer.mobile ? ' · ' + esc(b.customer.mobile) : ''}<br><small>Banavyu: <b>${esc(b.by)}</b> · ${esc(dtm('', b.createdAt))}${b.title ? ' · ' + esc(b.title) : ''}${b.note ? ' · ' + esc(b.note) : ''}</small></div>
    ${b.status === 'Cancelled' ? '<div class="note bad"><b>Aa record Cancel thayelo che.</b> Serial pachha free che. History sachvayeli che.</div>' : `<div class="brbar"><button class="btn" id="bradd">${ico('plus')} Part add</button>${isAdmin() ? '<button class="btn g" id="brcan">Cancel Record</button>' : ''}</div>`}${isAdmin() ? '<div class="brbar"><button class="btn g" id="brdel" style="color:#b91c1c">Delete Record</button></div>' : ''}
    <div class="tw"><table class="tbl brt"><thead><tr><th>Part</th><th>Serial</th><th>Photo</th></tr></thead><tbody>${b.parts.map(row).join('')}</tbody></table></div>

};
function brChange(b, part, parent) {

    <div class="row"><div class="fld"><label>Brand</label><input id="bcb" value="${esc(part.brand)}"></div><div class="fld"><label>Spec</label><input id="bcp" value="${esc(part.spec)}"></div></div>
    <div class="fld"><label>Photo</label><div class="brpr"><span id="bcimg"><span class="brnoph">-</span></span><button class="btn g" id="bcph" type="button">${ico('camera')} Photo</button></div></div>

<script>
/* ===== Purchase Invoice Import (PDF -> review -> approve). Admin only. ===== */
const PI_NUM = /\d[\d,]*\.\d{1,2}/g;
const piN = s => { const v = parseFloat(String(s || '').replace(/,/g, '')); return isFinite(v) ? v : 0; };
const piNorm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function piDate(s) {
  const m = String(s || '').match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if (!m) return '';
  let y = +m[3]; if (y < 100) y += 2000; const mo = +m[2], d = +m[1];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
const PI_SKIP_VENDOR = /^(tax\s*invoice|invoice|original|duplicate|triplicate|bill of supply|gstin|e-?way|page|\(?(original|duplicate)|cash|credit)/i;
/** lines: array of text lines of ONE invoice page. Returns a draft. Never invents data. */
function piParseLines(lines) {
  const L = lines.map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean), T = L.join('\n'), warn = [];
  const o = { vendor: '', gstin: '', invoiceNo: '', invoiceDate: '', terms: '', orderNo: '', subtotal: 0, sgst: 0, cgst: 0, igst: 0, grandTotal: 0, lines: [], warnings: warn };
  // invoice no / date / order no / terms
  let m = T.match(/Invoice\s*(?:No|Number|#)\.?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\/\-\._]{2,30})/i); if (m) o.invoiceNo = m[1];
  m = T.match(/(?:Invoice\s*)?Date\s*[:\-]?\s*(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})/i); if (m) o.invoiceDate = piDate(m[1]);
  m = T.match(/(?:Order|PO|P\.O\.)\s*(?:No|Number)\.?\s*[:\-]?\s*([A-Z0-9][A-Z0-9\/\-]{2,25})/i); if (m) o.orderNo = m[1];
  m = T.match(/(?:Terms|Payment Terms)\s*[:\-]?\s*(\d+\s*Days?)/i); if (m) o.terms = m[1];
  // vendor GSTIN: first GSTIN that is not right after a buyer-type label
  const gre = /\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b/g; let gm;
  const OWN = /BEMPC0588L/;
  while ((gm = gre.exec(T))) { if (OWN.test(gm[0])) continue; const before = T.slice(Math.max(0, gm.index - 60), gm.index); if (!/(bill\s*to|buyer|consignee|ship\s*to|party|customer|recipient|sold\s*to)[^]*$/i.test(before) || o.gstin === '') { if (!/(bill\s*to|buyer|consignee|ship\s*to|sold\s*to)[^]*$/i.test(before)) { o.gstin = gm[0]; break; } } }
  // vendor name: 1) "For XYZ" signature  2) "certified that XYZ has supplied"  3) name saved earlier for this GSTIN  4) mail sender  5) top line
  const me = /C\s*COMPUTER/i, clean = v => String(v || '').replace(/[|"]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80);
  let vf = (T.match(/^For\s+(?:M\/s\.?\s*)?([A-Z][A-Za-z0-9 &.,'()\-]{2,60})$/m) || [])[1];
  if (vf && me.test(vf)) vf = (T.match(/^For\s+(?!.*C\s*COMPUTER)(?:M\/s\.?\s*)?([A-Z][A-Za-z0-9 &.,'()\-]{2,60})$/m) || [])[1];
  if (!vf) { const c = T.match(/certified that\s+(.{3,60}?)\s+has supplied/i); if (c && !me.test(c[1])) vf = c[1]; }
  if (!vf && o.gstin) vf = piVendorMap()[o.gstin];
  if (!vf && PI_HINT.from) { const f = clean(String(PI_HINT.from).replace(/<.*>/, '')); if (f.length > 3 && !/@|gmail|account|noreply|^sales$|^tax invoice$/i.test(f)) vf = f.replace(/^Account\s+\w+\s+/i, ''); }
  if (!vf) for (let i = 0; i < Math.min(L.length, 12); i++) { const t = clean(L[i]); if (PI_SKIP_VENDOR.test(t) || /invoice|voucher|shree|shri|jay |jai |namah|ganesh|printed on|user\s*:/i.test(t) || /^[\d\W]+$/.test(t) || t.length < 4) continue; vf = t.replace(/\s*\(.*$/, ''); break; }
  o.vendor = clean(vf);
  // find table
  let hi = L.findIndex(t => /(description|particulars|item)/i.test(t) && /(qty|quantity)/i.test(t));
  if (hi < 0) hi = L.findIndex(t => /(description|particulars)/i.test(t));
  let end = L.findIndex((t, i) => i > hi && /^(sub\s*total|total\b|grand\s*total|amount in words|taxable)/i.test(t));
  if (hi < 0) warn.push('Item table not found - please add the items by hand.');
  else {
    if (end < 0) end = L.length;
    let cur = null;
    const flush = () => { if (cur) { if (cur.has) o.lines.push(cur); cur = null; } };
    const SER = /^[A-Z0-9][A-Z0-9\-\/]{7,24}$/i;
    const fill = (c, t) => {   // numbers of one item line: HSN, GST %, qty, rate, amount (+ a serial printed after the amount)
      const qm = t.match(/(\d+(?:\.\d+)?)\s*(Nos|No|Pcs|Pc|Unit|Units|Set|Sets)\b/i);
      const hs = (t.match(/\b(\d{4,8})\b/g) || []).find(h => h !== c.sr) || '';
      if (hs && !c.hsn) c.hsn = hs;
      const g = (t.match(/(\d{1,2}(?:\.\d+)?)\s*%/) || [])[1]; if (g) c.gst = g;
      const dec = (t.match(PI_NUM) || []).map(piN), qty = piN(qm[1]), amount = dec.length ? dec[dec.length - 1] : 0;
      let pre = t.slice(0, Math.min(...[hs ? t.indexOf(hs) : 1e9, t.indexOf(qm[0]), (t.search(/\d{1,2}(?:\.\d+)?\s*%/) + 1 || 1e9) - 1].filter(x => x >= 0)));
      if (c.desc === '' || c.has === false) { pre = pre.replace(/^\d{1,3}\s+/, c.desc === '' ? '' : '$&'); }
      if (/[A-Za-z]/.test(pre)) c.desc = (c.desc + ' ' + pre).trim();
      const lastNum = (t.match(PI_NUM) || []).pop(), tail = lastNum ? t.slice(t.lastIndexOf(lastNum) + lastNum.length).trim().split(/\s+/) : [];
      tail.forEach(x => { if (SER.test(x) && /\d/.test(x)) c.serialCand.push(x); });
      c.qty = qty; c.amount = amount; c.listRate = dec.length > 1 ? dec[0] : 0; c.rate = qty ? Math.round(amount / qty * 100) / 100 : c.listRate; c.has = true;
    };
    for (let i = hi + 1; i < end; i++) {
      const t = L[i], sr = t.match(/^(\d{1,3})\s+(?=[A-Za-z])(.*)$/), hasQ = /(\d+(?:\.\d+)?)\s*(Nos|No|Pcs|Pc|Unit|Units|Set|Sets)\b/i.test(t);
      const next = o.lines.length + (cur && cur.has ? 1 : 0) + 1;
      if (sr && +sr[1] === next && !(cur && !cur.has)) {
        flush(); cur = { sr: sr[1], desc: '', hsn: '', gst: '', qty: 0, rate: 0, amount: 0, serialCand: [], productId: '', has: false };
        if (hasQ) fill(cur, sr[2]); else cur.desc = sr[2].replace(/\s+\d{4,8}\s*$/, m => { cur.hsn = m.trim(); return ''; }).trim();
      } else if (cur && !cur.has && hasQ) fill(cur, t);
      else if (cur) {
        if (SER.test(t) && /\d/.test(t) && !/\s/.test(t)) cur.serialCand.push(t);
        else if (!cur.has && !/^(previous|outstanding|page|continued)/i.test(t)) cur.desc += ' ' + t;
        else if (cur.has && /^[A-Za-z]/.test(t) && !/^(previous|outstanding|page|continued|sub|total|sgst|cgst|igst)/i.test(t)) cur.desc += ' ' + t;
      }
    }
    flush();
  }
  // totals (never use Previous Balance / Outstanding)
  const last = re => { const x = L.find(t => re.test(t) && !/(previous|outstanding|balance)/i.test(t)); if (!x) return 0; const d = x.match(PI_NUM); return d ? piN(d[d.length - 1]) : (piN((x.match(/\d[\d,]*/g) || []).pop())); };
  o.subtotal = last(/^sub\s*total/i); o.sgst = last(/\bSGST\b/i); o.cgst = last(/\bCGST\b/i); o.igst = last(/\bIGST\b/i);
  o.grandTotal = last(/(grand\s*total|net\s*amount|total\s*amount|invoice\s*total)/i);
  const sum = o.lines.reduce((a, l) => a + l.amount, 0);
  if (!o.invoiceNo) warn.push('Invoice number not found - please type it.');
  if (!o.invoiceDate) warn.push('Invoice date not found - please set it.');
  if (!o.lines.length) warn.push('No item lines were read.');
  if (o.subtotal && o.lines.length && Math.abs(sum - o.subtotal) > 1) warn.push('Item total (' + sum.toFixed(2) + ') does not match Sub Total (' + o.subtotal.toFixed(2) + '). Check the lines.');
  if (o.grandTotal && o.subtotal && Math.abs(o.subtotal + o.sgst + o.cgst + o.igst - o.grandTotal) > 2) warn.push('Sub Total + tax does not match Grand Total. Check the bill.');
  o.lines.forEach(l => {   // serials printed inside the description as a comma list: move them to the serial box
    const m = l.desc.match(/(?:^|\s)((?:[A-Z0-9][A-Z0-9\-\/]{7,24})(?:\s*,\s*[A-Z0-9][A-Z0-9\-\/]{7,24})+)\s*,?\s*$/i);
    if (m) { const toks = m[1].split(/\s*,\s*/).filter(x => /\d/.test(x)); if (toks.length >= 2) { l.serialCand = l.serialCand.concat(toks); l.desc = l.desc.slice(0, l.desc.lastIndexOf(m[1])).trim(); } }
  });
  o.lines.forEach(l => { l.desc = l.desc.replace(/\s+/g, ' ').trim(); if (l.serialCand.length) l.serial = l.serialCand.join('\n'); });
  const gr = o.subtotal ? Math.round((o.sgst + o.cgst + o.igst) / o.subtotal * 100) : 0;
  if ([5, 12, 18, 28].includes(gr)) o.lines.forEach(l => { if (!l.gst) l.gst = String(gr); });
  return o;
}
let PI_HINT = {};
function piVendorMap() { try { return JSON.parse(localStorage.getItem('ccPiVendors') || '{}'); } catch (e) { return {}; } }
function piVendorSave(g, v) { if (!g || !v) return; try { const m = piVendorMap(); m[g] = v; localStorage.setItem('ccPiVendors', JSON.stringify(m)); } catch (e) { } }
/** pages: array of line-arrays. Same invoice number on several pages (Original / Transporter copy) = ONE invoice. */
function piParsePages(pages) {
  const out = [], seen = {};
  pages.forEach(pl => {
    const d = piParseLines(pl), k = piNorm(d.invoiceNo) || ('P' + out.length);
    if (seen[k]) { seen[k].copies++; return; }
    d.copies = 1; seen[k] = d; out.push(d);
  });
  return out;
}
async function piPdfPages(file) {
  if (!window.pdfjsLib) { await qLoadJs(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']); }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, pages = [];
  for (let n = 1; n <= Math.min(pdf.numPages, 12); n++) {
    const tc = await (await pdf.getPage(n)).getTextContent(), rows = [];
    tc.items.forEach(it => { if (!it.str || !it.str.trim()) return; const y = it.transform[5], x = it.transform[4]; let r = rows.find(q => Math.abs(q.y - y) < 3); if (!r) { r = { y, it: [] }; rows.push(r); } r.it.push({ x, w: it.width || 0, s: it.str }); });
    rows.sort((a, b) => b.y - a.y);
    pages.push(rows.map(r => { r.it.sort((a, b) => a.x - b.x); let s = '', px = null; r.it.forEach(i => { s += (px !== null && i.x - px > 6 ? '  ' : (px !== null ? ' ' : '')) + i.s; px = i.x + i.w; }); return s; }));
  }

}
async function piSha(file) { try { const h = await crypto.subtle.digest('SHA-256', await file.arrayBuffer()); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join(''); } catch (e) { return ''; } }
const piDataUrl = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });

/* ---------- screens ---------- */
let PI = null;
ACT.piopen = () => {
  const m = modal('Import PDF bill', `<div class="note info">Choose the vendor bill PDF. I will read it and show it to you. Nothing goes to stock until you press Approve.</div>
    <div class="fld"><input type="file" id="piF" accept="application/pdf"></div><div id="piMsg" class="tag"></div>`, { cls: 'n', foot: '<button class="btn g" data-x>Cancel</button><button class="btn" id="piGo">Read bill</button>' });
  m.$('#piGo').onclick = e => work(e.currentTarget, async () => {
    const f = m.$('#piF').files[0]; if (!f) throw new Error('Choose a PDF file first.');
    if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) throw new Error('This is not a PDF.');
    if (f.size > 5000000) throw new Error('PDF is too big (max 5 MB).');
    m.$('#piMsg').textContent = 'Reading PDF...';
    const pages = await piPdfPages(f), drafts = piParsePages(pages).filter(d => d.lines.length || d.invoiceNo);
    if (!drafts.length) throw new Error('Could not read text from this PDF (scanned?). Use "New purchase" with the bill photo instead.');
    const hash = await piSha(f), url = await piDataUrl(f);
    m.close(); piReview({ drafts, i: 0, hash, url, name: f.name });
  });
};
function piReview(st) {
  PI = st; const d = st.drafts[st.i];
  d.lines.forEach(l => { l._ser = l._ser !== undefined ? l._ser : (l.serial || ''); });
  const warn = d.warnings.map(w => `<div class="note bad">⚠ ${esc(w)}</div>`).join('');
  const copies = d.copies > 1 ? `<div class="note info">This invoice came ${d.copies} times in the PDF (Original + Transporter copy). Counted only once.</div>` : '';
  const m = modal('Check bill before saving' + (st.drafts.length > 1 ? ` (${st.i + 1}/${st.drafts.length})` : ''), `${copies}${warn}
    <div class="row"><div class="fld"><label>Vendor *</label><input id="piV" value="${esc(d.vendor)}"></div><div class="fld"><label>Invoice No *</label><input id="piB" value="${esc(d.invoiceNo)}"></div><div class="fld"><label>Date *</label><input id="piD" type="date" value="${esc(d.invoiceDate)}"></div></div>
    <div class="tag">Vendor GSTIN: ${esc(d.gstin) || '-'} · Terms: ${esc(d.terms) || '-'} · Order: ${esc(d.orderNo) || '-'} · Grand Total: ${d.grandTotal ? inr(d.grandTotal) : '-'} <i>(Previous Balance is NOT counted)</i></div>
    <div id="piL"></div>
    <label style="display:block;margin-top:10px"><input type="checkbox" id="piRecv" checked> Goods are in my shop now (add to stock)</label>`,
    { cls: 'w', foot: '<button class="btn bad" id="piRej">Reject</button><button class="btn g" data-x>Save for later</button><button class="btn ok" id="piOk">Approve &amp; add to stock</button>' });
  PI.m = m; piDraw();
  m.$('#piRej').onclick = e => work(e.currentTarget, async () => { const r = prompt('Reason for rejecting?'); if (!r) return; await piSaveDraft(false); await api('purimp.reject', { id: PI.id, reason: r }); toast('Rejected', 'ok'); m.close(); if (S.route === 'purchase') loadPur(); });
  m.$('#piOk').onclick = e => work(e.currentTarget, async () => {
    piRead(); const need = d.lines.filter(l => !l.productId);
    if (need.length) { m.$$('[data-pl]').forEach(c => { c.style.border = d.lines[+c.dataset.pl].productId ? '' : '2px solid #dc2626'; }); const f = m.$('[data-pl="' + d.lines.indexOf(need[0]) + '"]'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); throw new Error('Choose a product (Choose or + New) for the red lines (' + need.length + ' left).'); }
    const id = await piSaveDraft(true);
    const r = await api('purimp.approve', { id, receiveNow: m.$('#piRecv').checked, lines: d.lines.map(l => ({ productId: l.productId, qty: l.qty, rate: l.rate, serials: String(l._ser || '').split(/[\s,;]+/).filter(Boolean) })) }, { rid: PI.rid || (PI.rid = rid()) });
    toast('Saved as ' + r.purchaseId, 'ok'); m.close(); piBadge();
    if (PI.i + 1 < PI.drafts.length) { PI.i++; PI.id = null; PI.rid = null; piReview(PI); } else if (S.route === 'purchase') loadPur();
  });
}
function piRead() { const d = PI.drafts[PI.i], m = PI.m; d.vendor = m.$('#piV').value; d.invoiceNo = m.$('#piB').value; d.invoiceDate = m.$('#piD').value; m.$$('[data-pl]').forEach(c => { const l = d.lines[+c.dataset.pl]; l.qty = +$('[data-q]', c).value || 0; l.rate = +$('[data-r]', c).value || 0; l._ser = $('[data-s]', c) ? $('[data-s]', c).value : ''; }); }
async function piSaveDraft(quiet) {
  piRead(); const d = PI.drafts[PI.i]; piVendorSave(d.gstin, d.vendor);

const LG_IC = {
  user: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', eyeoff: '<path d="M3 3l18 18M10.6 5.1A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  laptop: '<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/>', desktop: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/>', service: '<path d="M14 6l4 4-9 9H5v-4zM13 7l4 4"/>', cctv: '<path d="M3 8l12-3 2 5-12 3zM17 9l4-1M10 14l-1 6"/>', acc: '<path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>', head: '<path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3zM17 19c0 1.5-2 2-5 2"/>', tool: '<path d="M14.5 6.5a4 4 0 0 0-5 5L3 18l3 3 6.5-6.5a4 4 0 0 0 5-5l-2.5 2.5-2-2z"/>',
  pin: '<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', prev: '<path d="M15 6l-6 6 6 6"/>', next: '<path d="M9 6l6 6-6 6"/>' };
const lgi = (k, sz) => `<svg viewBox="0 0 24 24" width="${sz || 20}" height="${sz || 20}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${LG_IC[k]}</svg>`;
let lgTimer = null, lgIdx = 0;
function lgStop() { if (lgTimer) { clearInterval(lgTimer); lgTimer = null; } }
function lgShow(n) {
  const sl = $$('.lg-s'), dots = $$('.lg-dots i'); if (!sl.length) return lgStop();
  lgIdx = (n + sl.length) % sl.length;
  sl.forEach((x, i) => x.classList.toggle('on', i === lgIdx)); dots.forEach((x, i) => x.classList.toggle('on', i === lgIdx));
  const nx = sl[(lgIdx + 1) % sl.length]; if (nx && !nx.style.backgroundImage) nx.style.backgroundImage = `url(${nx.dataset.bg})`;   // preload next
}
function lgStart() { lgStop(); lgTimer = setInterval(() => { if (!$('.lg-s')) return lgStop(); if (!document.hidden) lgShow(lgIdx + 1); }, 5000); }
function renderLogin(msg) {
  S.token = null; S.user = null; document.body.classList.remove('in'); hideSplash(); lgStop();
  const ll = store.lget('lgl') || (S.lang === 'gu' ? 'gu' : 'en'), T = LGT[ll] || LGT.en, bgs = window.LBG && window.LBG.length ? (window.innerWidth <= 820 ? [window.LBG[0]] : window.LBG) : [window.DREAM], remId = store.lget('rem_id') || '';
  const cats = ['laptop', 'desktop', 'service', 'cctv', 'acc'], trs = ['shield', 'head', 'tool'];
  $('#root').innerHTML = `<div class="lg">
    <div class="lg-slides">${bgs.map((b, i) => `<div class="lg-s ${i === 0 ? 'on' : ''}" data-bg="${b}" ${i === 0 ? `style="background-image:url(${b})"` : ''}></div>`).join('')}<div class="lg-shade"></div></div>
    <div class="lg-left"><div class="lg-brand"><img src="${window.LOGO}" alt="C COMPUTER"></div><div class="lg-cats">${cats.map((c, i) => `<div style="animation-delay:${i * .12}s">${lgi(c, 30)}<span>${esc(T.cats[i])}</span></div>`).join('')}</div></div>
    <form class="lg-card" id="lf" autocomplete="off">
      <div class="lg-logo"><img src="${window.LOGO}" alt="C COMPUTER"></div><div class="lg-tag">ERP LOGIN</div>
      <h2>Welcome Back!</h2><p class="lg-sub">${esc(T.sub)}</p>
      ${msg ? `<div class="note">${esc(msg)}</div>` : ''}
      <div class="lg-f"><i>${lgi('user', 18)}</i><input id="li" placeholder="${esc(T.id)}" autocapitalize="off" autocomplete="username" required value="${esc(remId)}"></div>
      <div class="lg-f"><i>${lgi('lock', 18)}</i><input id="lp" type="password" placeholder="${esc(T.pin)}" inputmode="numeric" maxlength="8" autocomplete="current-password" required><button type="button" class="lg-eye" id="leye" aria-label="Show / hide PIN">${lgi('eye', 19)}</button></div>
      <div class="lg-row"><label class="lg-rem"><input type="checkbox" id="lrem" ${remId ? 'checked' : ''}> ${esc(T.rem)}</label><a href="#" id="lfg">${esc(T.fg)}</a></div>
      <button class="lg-go" id="lgo"><span>${esc(T.go)}</span> ${lgi('arrow', 18)}</button>
      <div class="lang" id="llang">${[['en', 'EN'], ['gu', 'ગુજરાતી'], ['hi', 'हिंदी']].map(k => `<button type="button" data-l="${k[0]}" class="${ll === k[0] ? 'on' : ''}">${k[1]}</button>`).join('')}</div>
      <div class="lg-ft">Sales | Service | Accessories<br><span>${lgi('pin', 14)} Katargam, Surat</span></div></form>
    <div class="lg-trust">${trs.map((t, i) => `<div>${lgi(t, 26)}<span>${esc(T.tr[i])}</span></div>`).join('')}</div>
    ${bgs.length > 1 ? `<button type="button" class="lg-ar lg-prev" id="lgp" aria-label="Previous">${lgi('prev', 22)}</button><button type="button" class="lg-ar lg-next" id="lgn" aria-label="Next">${lgi('next', 22)}</button><div class="lg-dots">${bgs.map((b, i) => `<i data-i="${i}" class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>`;
  if (bgs.length > 1) { const nx = new Image(); nx.src = bgs[1]; lgStart(); $('#lgp').onclick = () => { lgShow(lgIdx - 1); lgStart(); }; $('#lgn').onclick = () => { lgShow(lgIdx + 1); lgStart(); }; $$('.lg-dots i').forEach(d => d.onclick = () => { lgShow(+d.dataset.i); lgStart(); }); }
  $('#leye').onclick = () => { const p = $('#lp'), h = p.type === 'password'; p.type = h ? 'text' : 'password'; $('#leye').innerHTML = lgi(h ? 'eyeoff' : 'eye', 19); };
  $('#lfg').onclick = ev => { ev.preventDefault(); modal('Forgot Password?', `<p>${esc(T.fgm)}</p>`, { cls: 'n' }); };
  $$('#llang button').forEach(b => b.onclick = () => { store.lset('lgl', b.dataset.l); if (b.dataset.l !== 'hi') { S.lang = b.dataset.l; store.lset('lang', S.lang); } renderLogin(msg); });
  $('#lf').onsubmit = ev => {
    ev.preventDefault(); const btn = $('#lgo'); if (btn.disabled) return; btn.disabled = true;
    busy(true);
    google.script.run.withSuccessHandler(r => {
      busy(false); btn.disabled = false;
      if (!r || !r.ok) { $('#lp').value = ''; return toast((r && r.error) || 'Login failed', 'bad'); }
      if ($('#lrem') && $('#lrem').checked) store.lset('rem_id', $('#li').value.trim()); else store.lset('rem_id', ''); lgStop(); S.token = r.data.token; S.user = r.data.user; store.set('tok', S.token); store.lset('tok2', JSON.stringify({ t: S.token, at: Date.now(), seen: Date.now() })); startApp();
    }).withFailureHandler(() => { busy(false); btn.disabled = false; toast('Network problem. Check internet and try again.', 'bad'); })
      .api(null, 'login', { loginId: $('#li').value, pin: $('#lp').value });
  };
  setTimeout(() => $('#li') && $('#li').focus(), 50);
}
function doLogout(auto) {
  APIC.clear(); swrClear();
  const t = S.token; S.stack = []; store.del('tok'); store.del('route'); store.lset('tok2', '');
  if (t && !auto) { try { google.script.run.api(t, 'logout', {}); } catch (e) { } }
  S.token = null; S.user = null; S.boot = null; PQ && (PQ.items = []);
  renderLogin(auto ? 'Session ended. Please login again.' : '');
}
ACT.logout = () => doLogout(false);
ACT.svshow = (d, el) => { const v = $('#sval'); if (!v) return; const hid = v.textContent.indexOf('•') >= 0; v.textContent = hid ? v.dataset.v : '₹ ••••••'; (el || $('[data-act=svshow]')).textContent = hid ? 'Hide' : 'Show'; };

/* ---------- shell ---------- */
function renderShell() {
  if (!S.user) return;
  const a = isAdmin(), items = navItems();
  const nm = S.user.name || S.user.loginId;
  $('#root').innerHTML = `<div class="app">
    <aside class="side"><div class="brand"><img src="${window.LOGO}" alt="C COMPUTER"></div><nav>${items.map(k => `<a data-act="go" data-r="${k}" class="${S.route === k ? 'on' : ''}">${ico(k)}<span>${LI(k)}</span></a>`).join('')}</nav><div class="ver">C COMPUTER ERP · ${a ? 'Admin' : 'Staff'}</div></aside>
    <div class="main">
      <header class="top"><button class="ibtn burger" id="burger">${ico('menu')}</button>
        <div class="sbox">${ico('search')}<input id="gs" placeholder="${LT('search')}" autocomplete="off"><div id="sdrop"></div></div>
        <button class="ibtn" data-act="scanhome" title="${LT('scan')}">${ico('scan')}</button>
        <div class="lang">${Object.keys(LANGS).map(k => `<button data-act="lang" data-l="${k}" class="${S.lang === k ? 'on' : ''}">${LANGS[k]}</button>`).join('')}</div>
        <div class="me" id="me"><div class="av">${esc(nm.charAt(0).toUpperCase())}</div><div style="line-height:1.15"><b style="font-size:13px">${esc(nm)}</b><br><small style="color:#64748b">${a ? 'Admin' : 'Staff'}</small></div></div>
      </header>
      <main id="page" class="page"></main></div><button class="aifab" data-act="aiopen" title="AI Assistant">🤖</button>
    <nav class="bnav" ${userMenus() ? 'style="display:none"' : ''}><a data-act="go" data-r="quotes" class="${S.route === 'quotes' || S.route === 'quote' ? 'on' : ''}">${ico('quotes')}Quotation</a>
      ${a || (S.user.name || '').toUpperCase().startsWith('NAKUL') ? `<a data-act="go" data-r="cash" class="${S.route === 'cash' ? 'on' : ''}">${ico('cash')}Cash</a>` : ''}
      <a data-act="more">${ico('menu')}${LT('more')}</a></nav></div>`;
  $('#burger').onclick = () => $('.side').classList.toggle('open');
  $('#me').onclick = userMenu;
  const gs = $('#gs');
  gs.oninput = debounce(async () => {
    const q = gs.value.trim(), box = $('#sdrop'); if (q.length < 2) { box.innerHTML = ''; return; }
    try {
      const r = await api('search', { q }); if (gs.value.trim() !== q) return;
      const grp = (t, arr, act, key) => arr.length ? `<div class="g">${t}</div>` + arr.map(x => `<div class="it" data-act="${act}" data-id="${esc(x.id)}" data-code="${esc(x.id)}"><span>${esc(x.name)}</span><small>${esc(x.sub)}</small></div>`).join('') : '';
      const html = grp(LT('products'), r.products, 'sr_prod') + grp(LT('customers'), r.customers, 'sr_cust') + grp(LT('orders'), r.orders, 'sr_ord') + grp('Serial / Item', r.items, 'sr_item');
      box.innerHTML = `<div class="drop">${html || '<div class="it"><small>Nothing found</small></div>'}</div>`;
    } catch (e) { box.innerHTML = ''; }
  }, 250);
  gs.onkeydown = e => { if (e.key === 'Escape') { gs.value = ''; $('#sdrop').innerHTML = ''; } };
  document.addEventListener('click', ev => { if (!ev.target.closest('.sbox')) { const d = $('#sdrop'); if (d) d.innerHTML = ''; } }, { once: false });
}
const closeSearch = () => { const g = $('#gs'); if (g) g.value = ''; const d = $('#sdrop'); if (d) d.innerHTML = ''; };
ACT.sr_prod = d => { closeSearch(); go('products'); setTimeout(() => ACT.openprod({ id: d.id }), 50); };
ACT.sr_cust = d => { closeSearch(); go('customers'); setTimeout(() => ACT.opencust({ id: d.id }), 50); };
ACT.sr_ord = d => { closeSearch(); go('sales'); setTimeout(() => ACT.openorder({ id: d.id }), 50); };
ACT.sr_item = d => { closeSearch(); go('serial'); setTimeout(() => ACT.openitem({ id: d.id }), 50); };

/* mobile: + button and More sheet */
function sheet(title, entries) {
  const m = modal(title, `<div class="tiles">${entries.map(e => `<div class="tile" data-sh="${e[0]}">${ico(e[1])}${e[2]}</div>`).join('')}</div>`, { cls: 'n' });
  m.el.addEventListener('click', ev => { const t = ev.target.closest('[data-sh]'); if (!t) return; const e = entries.find(x => x[0] === t.dataset.sh); m.close(); e[3](); });
}
ACT.plus = () => sheet('+', [
  ['o', 'sales', LI('neworder'), () => go('sales', { new: 1 })], ['p', 'purchase', LI('newpurchase'), () => go('purchase', { new: 1 })],
  ['s', 'scan', LI('scanbarcode'), () => go('scan')], ['c', 'customers', LT('add') + ' ' + LT('customers'), () => { go('customers'); setTimeout(() => ACT.newcust(), 60); }]]);
ACT.more = () => sheet(LT('more'), navItems().filter(k => !['dash', 'products', 'stock'].includes(k)).map(k => [k, k, LI(k), () => go(k)]));
ACT.scanhome = () => go('scan');

/* user menu: change PIN, logout */
function userMenu() {
  const m = modal(esc(S.user.name || S.user.loginId), `<div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile" data-u="pin">${ico('lock')}${LI('changepin')}</div><div class="tile" data-u="out">${ico('logout')}${LI('logout')}</div></div>`, { cls: 'n' });
  m.el.addEventListener('click', e => { const t = e.target.closest('[data-u]'); if (!t) return; m.close(); t.dataset.u === 'pin' ? pinForm() : doLogout(false); });
}
function pinForm() {
  const m = modal(LI('changepin'), `<div class="fld"><label>Current PIN</label><input id="p0" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password"></div><div class="row"><div class="fld"><label>New PIN (4-8 digits)</label><input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="fld"><label>Repeat new PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div>`, { cls: 'n', foot: `<button class="btn" id="pgo">${LT('save')}</button>` });
  m.$('#pgo').onclick = e => work(e.currentTarget, async () => {
    if (m.$('#p1').value !== m.$('#p2').value) throw new Error('New PIN and repeat PIN are not the same');
    await api('changePin', { oldPin: m.$('#p0').value, newPin: m.$('#p1').value }); toast('PIN changed', 'ok'); m.close();
  });
}

/* auto logout after 30 min idle (server session is 6 h) */
let idleT, idleW = 0; const IDLE = 3 * 60 * 60 * 1000;   /* 3 hours idle; login also survives a tab reload / app switch (e.g. choosing a photo) */
function idleReset() { clearTimeout(idleT); if (S.token) { idleT = setTimeout(() => doLogout(true), IDLE); const n = Date.now(); if (n - idleW > 20000) { idleW = n; try { const o = JSON.parse(store.lget('tok2') || 'null'); if (o && o.t === S.token) { o.seen = n; store.lset('tok2', JSON.stringify(o)); } } catch (e) { } } } }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, idleReset, { passive: true }));

/* ---------- start ---------- */
async function startApp() {
  showSplash(S.user && S.user.name);
  try {
    S.boot = await api('bootstrap', {});
    S.user = S.boot.user; S.lang = store.lget('lang') || S.boot.lang || 'both';
    document.body.classList.add('in'); renderShell(); idleReset();
    const r = store.get('route'); go(r && ROUTES[r] ? r : (isAcct() ? 'sales' : 'dash'), {}, true); showSplash(S.user.name); hideSplash();
    prefetchLists();
  } catch (e) { renderLogin(e.message); }
}
/* After login, quietly load the main lists in the background so the pages open instantly. Read-only; failures are ignored. */
function prefetchLists() {
  const go1 = () => {
    const q = [['prod.list', { q: '', category: '', status: 'all', low: false, page: 1, size: 24 }], ['stock.list', { q: '', category: '', low: false, page: 1, tab: 'stock', mtype: '', mq: '', mpage: 1 }], ['cust.list', { q: '', page: 1 }], ['ord.list', { q: '', status: '', page: 1 }], ['quote.list', { q: '', status: '', page: 1 }]];
    if (isAcct()) return;
    let i = 0; const next = () => { if (i >= q.length || !S.user) return; const x = q[i++]; api(x[0], x[1]).catch(() => { }).then(() => setTimeout(next, 150)); };
    next();
  };
  setTimeout(go1, 1500);
}
(function init() {
  S.lang = store.lget('lang') || 'both';
  let t = store.get('tok');
  if (!t) { try { const o = JSON.parse(store.lget('tok2') || 'null'); if (o && o.t && Date.now() - o.seen < 3 * 3600 * 1000 && Date.now() - o.at < 6 * 3600 * 1000) { t = o.t; store.set('tok', t); } else if (o) store.lset('tok2', ''); } catch (e) { } }
  if (t) { S.token = t; startApp(); } else renderLogin();
})();
</script>
